.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a22;color:#fff;padding:8px 14px;border-radius:8px;z-index:3000;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}

.sizebar{display:none}

#ctlbody{display:grid;gap:6px}
@media (max-width:860px){

 header h1{font-size:15px}
 header .sub{display:none}
 header .sum{margin-left:auto;font-size:12px}
 .mapctl{max-width:230px;padding:6px 8px;max-height:calc(100% - 20px);overflow:auto}

 button.btn{padding:10px 16px}

}

<body>
<header>
  <h1>Skogsbruksplan</h1>
  <span class="sub">Fastighet 65-407-1-27 · underlag från Ålands landskapsregering</span>
  <span class="sum" id="hsum"></span>
  <button id="cloudchip" type="button" hidden></button>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="mapctl" id="mapctl"><button id="ctltoggle" class="btn sec" type="button">Kartlager ▾</button><div id="ctlbody">
      <label>Bakgrundskarta
        <select id="basesel"><option value="sat">Satellit (Esri)</option><option value="mmlortho">Flygbild (Lantmäteriverket)</option><option value="mmltopo">Terrängkarta (Lantmäteriverket)</option><option value="osm">Gatukarta (OSM)</option><option value="none">Ingen</option></select>
      </label>
      <label>Färglägg efter
        <select id="themesel"></select>
      </label>
      <label>Fyllning
        <input type="range" id="opac" min="0" max="90" value="55">
      </label>
      <div class="row"><input type="checkbox" id="ovprop"><label for="ovprop">Fastighetsgränser</label></div>
      <div class="row"><input type="checkbox" id="ovids"><label for="ovids">Fastighetsbeteckningar</label></div>
      <details id="lrdet" open><summary>Landskapsregeringen</summary>
        <div class="row"><input type="checkbox" id="lrforn"><label for="lrforn">Fornminnen</label></div>
        <div class="row"><input type="checkbox" id="lrnat"><label for="lrnat">Naturreservat</label></div>
        <div class="row"><input type="checkbox" id="lrn2k"><label for="lrn2k">Natura 2000</label></div>
      </details>
      <div class="row"><input type="checkbox" id="lblchk" checked><label for="lblchk">Figurnummer (zooma in)</label></div>
      <button class="btn sec" id="fitbtn" type="button">Visa hela fastigheten</button>
    </div></div>
    <div id="legend"></div>
    <button id="gpsinfo" type="button" hidden></button>
  </div>
  <aside>
    <div class="sizebar" id="sizebar"><button id="sizedown" type="button">▼ Mindre</button><button id="sizeup" type="button">▲ Maximera</button><button id="sizehide" type="button">Dölj meny ▾</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="card" aria-selected="true">Bestånd</button>
      <button class="tab" role="tab" data-tab="acts" aria-selected="false">Åtgärder</button>
      <button class="tab" role="tab" data-tab="table" aria-selected="false">Tabell</button>
      <button class="tab" role="tab" data-tab="data" aria-selected="false">Data</button>
    </div>
    <section class="pane on" id="pane-card"></section>
    <section class="pane" id="pane-acts"></section>
    <section class="pane" id="pane-table"></section>
    <section class="pane" id="pane-data"></section>
  </aside>
</main>
<div id="loginview" hidden>
  <div class="loginbox">
    <div><b style="font-size:18px">Skogsbruksplan</b><div class="small muted">Fastighet 65-407-1-27</div></div>
    <form id="loginform" style="display:grid;gap:12px">
      <label>E-post<input id="loginemail" type="email" autocomplete="username" inputmode="email"></label>
      <label>Lösenord<input id="loginpw" type="password" autocomplete="current-password"></label>
      <button class="btn" id="loginbtn" type="submit">Logga in</button>
    </form>
    <div id="loginmsg"></div>
    <button class="lnk" id="loginlocal" type="button" hidden>Fortsätt utan inloggning (endast den här enheten)</button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
let STANDS = {"type":"FeatureCollection","features":[]};
const STANDS_EMBEDDED = STANDS.features.length>0;   // i den publika webbversionen är beståndsdatan inte inbyggd utan hämtas efter inloggning
const PROP = '65-407-1-27';
const LS_KEY = 'skogsplan:' + PROP + ':v1';
const ACTION_TYPES = ['Plantering','Markberedning','Slyröjning','Iståndsättningsröjning','Gallring','Slutavverkning','Annat'];
const VOL_TYPES = ['Gallring','Slutavverkning','Annat'];
/* Förslag på kommande åtgärder (yrs = år efter den åtgärd som lagts in). Nyckel: Åtgärd eller Åtgärd|Detalj */
const FOLLOW = {
  'Plantering':[{type:'Slyröjning',yrs:5}],
  'Slyröjning':[{type:'Iståndsättningsröjning',yrs:10,note:'Osäkert intervall – justera efter besök'}],
  'Markberedning':[{type:'Plantering',yrs:1}],
  'Iståndsättningsröjning':[{type:'Gallring',sub:'Förstagallring',yrs:10}],
  'Gallring|Förstagallring':[{type:'Gallring',sub:'Andra gallring',yrs:10}],
  'Gallring|Andra gallring':[{type:'Slutavverkning',yrs:10}],
  'Gallring|Sengallring':[{type:'Slutavverkning',yrs:10}],
  'Slutavverkning|Kalyta':[{type:'Markberedning',yrs:0},{type:'Plantering',yrs:1}],
  'Slutavverkning|Fröträdsställning':[{type:'Markberedning',yrs:0},{type:'Slutavverkning',sub:'Kalyta',yrs:10,note:'Avveckla fröträden'}],
  'Slutavverkning|Skärmställning':[{type:'Markberedning',yrs:0},{type:'Slutavverkning',sub:'Kalyta',yrs:10,note:'Avveckla skärmen'}]
};

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = (n,d=0)=>Number(n).toLocaleString('sv-SE',{minimumFractionDigits:d,maximumFractionDigits:d});

const MML='https://avoin-karttakuva.maanmittauslaitos.fi/avoin/wmts/1.0.0/';
let lastErr=0;
function mmlLayer(name,ext,opts){
  // Lantmäteriverkets öppna WMTS har kartrutor till och med nivå 16 (fastighetsgränser: nivå 12–16). Därefter förstoras rutorna.
  const l=L.tileLayer(MML+name+'/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.'+ext+'?api-key='+encodeURIComponent(mmlKey),
    {minZoom:0,maxNativeZoom:16,maxZoom:19,keepBuffer:1,attribution:'© Lantmäteriverket',...opts});
  l.on('tileerror',e=>{
    const t=e.tile;
    if(t&&!t._retried){            // tjänsten kan avvisa rutor vid hög belastning – försök en gång till
      t._retried=true;
      setTimeout(()=>{const u=t.src;t.src='';t.src=u+(u.includes('&r=1')?'':'&r=1');},600+Math.random()*700);
      return;
    }
    if(Date.now()-lastErr>15000){lastErr=Date.now();toast('Några kartrutor från Lantmäteriverket kunde inte hämtas. Testa nyckeln under Data.');}
  });
  return l;
}

/* egen fastighetsgräns (GeoJSON, WGS84 eller ETRS-TM35FIN) */
function tm35ToLonLat(E,N){
  const a=6378137,f=1/298.257222101,k0=0.9996,lon0=27*Math.PI/180,FE=500000;
  const n=f/(2-f),A=a/(1+n)*(1+n*n/4+n**4/64);
  const b=[n/2-2*n*n/3+37*n**3/96-n**4/360,n*n/48+n**3/15-437*n**4/1440,17*n**3/480-37*n**4/840,4397*n**4/161280];
  const d=[2*n-2*n*n/3-2*n**3,7*n*n/3-8*n**3/5,56*n**3/15,4279*n**4/630];
  const xi=N/(k0*A),eta=(E-FE)/(k0*A);
  let xi2=xi,eta2=eta;
  for(let j=1;j<=4;j++){xi2-=b[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);eta2-=b[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);}
  const chi=Math.asin(Math.sin(xi2)/Math.cosh(eta2));
  let phi=chi;for(let j=1;j<=4;j++)phi+=d[j-1]*Math.sin(2*j*chi);
  const lam=lon0+Math.atan2(Math.sinh(eta2),Math.cos(xi2));
  return [lam*180/Math.PI,phi*180/Math.PI];
}
function mapCoords(c,fn){return typeof c[0]==='number'?fn(c):c.map(x=>mapCoords(x,fn));}
function firstCoord(c){return typeof c[0]==='number'?c:firstCoord(c[0]);}

function toWgs84(gj){
  const feats=gj.type==='FeatureCollection'?gj.features:[gj.type==='Feature'?gj:{type:'Feature',properties:{},geometry:gj}];
  const sample=feats.map(f=>f.geometry&&f.geometry.coordinates).find(Boolean);
  if(!sample)throw new Error('Inga geometrier i filen');
  const crsName=(gj.crs&&gj.crs.properties&&gj.crs.properties.name)||'';
  const fc=firstCoord(sample);
  const is3067=/3067/.test(crsName)||Math.abs(fc[0])>1000;
  if(!is3067)return {type:'FeatureCollection',features:feats};
  return {type:'FeatureCollection',features:feats.map(f=>({type:'Feature',properties:f.properties||{},geometry:{type:f.geometry.type,coordinates:mapCoords(f.geometry.coordinates,c=>tm35ToLonLat(c[0],c[1]))}}))};
}

const EARTH=6378137;
function tileBBox3857(x,y,z){const size=2*Math.PI*EARTH/Math.pow(2,z);const minx=-Math.PI*EARTH+x*size,maxy=Math.PI*EARTH-y*size;return [minx,maxy-size,minx+size,maxy];}
const ArcTile=L.TileLayer.extend({
  initialize:function(def,opts){this._def=def;L.TileLayer.prototype.initialize.call(this,'',opts);},
  getTileUrl:function(c){
    const b=tileBBox3857(c.x,c.y,c.z);
    return LR+this._def.svc+'/MapServer/export?bbox='+b.join(',')+'&bboxSR=3857&imageSR=3857&size=256,256&dpi=96&format=png32&transparent=true&layers=show:'+this._def.layers.map(l=>l.id).join(',')+'&f=image';
  }
});

let identWarned=false;
function popupHTML(items){
  return items.map(it=>{
    const types=Object.fromEntries((it.fields||[]).map(f=>[f.name,f.type]));
    const rows=Object.entries(it.attrs).filter(([k,v])=>v!==null&&v!==''&&!/^(OBJECTID|Shape|SHAPE|created_|last_edited_|MuutosPvm)/.test(k)).map(([k,v])=>{
      let val=types[k]==='esriFieldTypeDate'?new Date(v).toLocaleDateString('sv-SE'):String(v);
      if(val.length>400)val=val.slice(0,400)+'…';
      return `<tr><td style="color:#666;padding-right:8px;vertical-align:top">${esc(it.aliases[k]||k)}</td><td>${esc(val)}</td></tr>`;
    }).join('');
    return `<b>${esc(it.title)}</b><table style="font-size:12px;margin:4px 0 8px">${rows}</table>`;
  }).join('');
}
async function identifyLR(e){
  const act=Object.keys(lrLayers).filter(k=>lrLayers[k]);
  if(!act.length)return;
  const mpp=156543.03392*Math.cos(e.latlng.lat*Math.PI/180)/Math.pow(2,map.getZoom());
  const dist=Math.max(2,6*mpp);
  const out=[];
  await Promise.all(act.flatMap(k=>LR_DEFS[k].layers.map(async ly=>{
    const url=LR+LR_DEFS[k].svc+'/MapServer/'+ly.id+'/query?geometry='+e.latlng.lng+','+e.latlng.lat+'&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance='+dist+'&units=esriSRUnit_Meter&outFields=*&returnGeometry=false&f=json';
    try{
      const r=await fetch(url);const j=await r.json();
      (j.features||[]).forEach(f=>out.push({title:ly.name,attrs:f.attributes,aliases:j.fieldAliases||{},fields:j.fields||[]}));
    }catch(err){if(!identWarned){identWarned=true;toast('Kunde inte läsa detaljer från landskapsregeringens server (klicka-för-info)');}}
  })));
  if(out.length)L.popup({maxWidth:320}).setLatLng(e.latlng).setContent(popupHTML(out)).openOn(map);
}
map.on('click',identifyLR);

let gpsState=0,gpsWatch=null,gpsDot=null,gpsAcc=null,gpsLast=null,gpsCentered=false;
function pip(pt,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function polyContains(poly,pt){
  if(!pip(pt,poly[0]))return false;
  for(let k=1;k<poly.length;k++)if(pip(pt,poly[k]))return false;
  return true;
}
function standAt(lng,lat){
  for(const f of STANDS.features)if(f.geometry.coordinates.some(poly=>polyContains(poly,[lng,lat])))return f.properties.id;
  return null;
}
const GPS_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg>';
function updateGpsBtn(){
  const a=document.getElementById('gpsbtn');if(!a)return;
  a.className=gpsState===1?'on':gpsState===2?'follow':'';
  a.title=gpsState===0?'Visa min position':gpsState===1?'Följ min position':'Stäng av position';
}
function stopGPS(){
  if(gpsWatch!=null&&navigator.geolocation)navigator.geolocation.clearWatch(gpsWatch);
  gpsWatch=null;gpsState=0;gpsLast=null;gpsCentered=false;
  if(gpsDot){map.removeLayer(gpsDot);gpsDot=null;}
  if(gpsAcc){map.removeLayer(gpsAcc);gpsAcc=null;}
  $('#gpsinfo').hidden=true;
  updateGpsBtn();
}
function onPos(p){
  const ll=[p.coords.latitude,p.coords.longitude],acc=p.coords.accuracy||0;
  gpsLast=ll;
  if(!gpsDot){
    gpsAcc=L.circle(ll,{pane:'gps',radius:acc,color:'#1e88e5',weight:1,fillColor:'#1e88e5',fillOpacity:.12,interactive:false}).addTo(map);
    gpsDot=L.circleMarker(ll,{pane:'gps',radius:8,color:'#fff',weight:3,fillColor:'#1e88e5',fillOpacity:1,interactive:false}).addTo(map);
  }else{gpsAcc.setLatLng(ll).setRadius(acc);gpsDot.setLatLng(ll);}
  if(!gpsCentered||gpsState===2){gpsCentered=true;map.setView(ll,Math.max(map.getZoom(),16));}
  const id=standAt(ll[1],ll[0]),el=$('#gpsinfo');
  el.hidden=false;
  const accTxt=acc?` · ±${Math.round(acc)} m`:'';
  if(id!=null){const q=eff(id);el.dataset.sid=id;el.textContent=`Du är i figur ${q.fig} (${id})${accTxt}`;}
  else{delete el.dataset.sid;el.textContent=`Utanför bestånden${accTxt}`;}
}
function onGpsErr(err){
  if(err&&err.code===1){
    stopGPS();
    const local=!/^https:$/.test(location.protocol)&&location.hostname!=='localhost';
    toast(local?'GPS fungerar inte när sidan öppnas som fil. Lägg sidan på en https-adress – se Data → GPS och genväg.':'Platsåtkomst nekades. Tillåt plats för Chrome och för den här sidan och försök igen – se Data → GPS och genväg.');
  }
  else if(err&&err.code===2){toast('Positionen är inte tillgänglig just nu');}
  else{toast('Letar efter GPS-signal…');}
}
function cycleGPS(){
  if(gpsState===0){
    if(!navigator.geolocation){toast('GPS stöds inte i den här webbläsaren');return;}
    gpsState=1;gpsCentered=false;
    gpsWatch=navigator.geolocation.watchPosition(onPos,onGpsErr,{enableHighAccuracy:true,maximumAge:3000,timeout:30000});
    toast('Letar efter din position…');
  }else if(gpsState===1){
    gpsState=2;if(gpsLast)map.setView(gpsLast,Math.max(map.getZoom(),16));toast('Kartan följer din position');
  }else stopGPS();
  updateGpsBtn();
}

function saveEdit(){
  const f=$('#editform');if(!f)return;
  const base=baseOf(selId);
  const num=n=>{const v=f.elements[n].value.trim();return v===''?null:Number(v);};
  const cand={grp:f.elements.grp.value,utv:f.elements.utv.value||null,tsl:f.elements.tsl.value||null,vol:num('vol'),timmer:num('timmer'),massa:num('massa')};
  const age=num('age');
  if([cand.vol,cand.timmer,cand.massa,age].some(v=>v!==null&&(!isFinite(v)||v<0))){toast('Kontrollera siffrorna – de måste vara 0 eller större');return;}
  const e={};
  for(const k of EDIT_FIELDS){
    if(cand[k]===null&&(k==='vol'||k==='timmer'||k==='massa'))continue;
    if((cand[k]??null)!==(base[k]??null))e[k]=cand[k];
  }
  if(age!==null)e.age=age;
  const note=f.elements.note.value.trim();if(note)e.note=note;
  if(Object.keys(e).length)edits[selId]=e;else delete edits[selId];
  saveActions();editMode=false;afterEdit();leaveForm();toast('Uppgifterna sparades');
}

      <label>År<input name="year" type="number" min="1990" max="2100" value="${yr}"></label>
      <label id="datewrap" style="${st==='utford'?'':'display:none'}">Datum (valfritt)<input name="date" type="date" value="${esc(a&&a.date?a.date:'')}"></label>
    </div>
    <label id="volwrap" style="${VOL_TYPES.includes(t)?'':'display:none'}">Uttag / volym, m³ (valfritt)<input name="vol" type="number" min="0" step="1" inputmode="numeric" value="${a&&a.vol!=null?esc(a.vol):''}"></label>
    <label>Kommentar<textarea name="note" rows="2">${esc(a?a.note:'')}</textarea></label>
    <div style="display:flex;gap:8px"><button class="btn" data-do="saveform" type="button">Spara</button><button class="btn sec" data-do="cancelform" type="button">Avbryt</button></div>
  </form>`;
}
function buildSuggestions(a){
  const k2=a.type+'|'+(a.sub||'');
  const key=FOLLOW[k2]?k2:a.type;
  const rules=FOLLOW[key]||[];
  return rules.map((r,i)=>({type:r.type,sub:r.sub||'',year:a.year+ruleYrs(key,i,r.yrs),note:r.note||''}))
    .filter(sg=>!actsFor(a.standId).some(x=>x.status==='planerad'&&x.type===sg.type&&(!sg.sub||x.sub===sg.sub)));
}
function sugHTML(){
  return `<div class="act-item" id="sugbox" style="background:#eef6ff;border-color:#b9d4f0">
    <b>Föreslagna kommande åtgärder</b>
    <div class="small muted" style="margin:2px 0 6px">Efter ${esc(suggest.from)}. Justera året eller avmarkera.</div>
    ${suggest.items.map((sg,i)=>`<div class="sugrow"><label><input type="checkbox" data-sug="${i}" checked> ${esc(sg.type)}${sg.sub?' – '+esc(sg.sub):''}</label><input type="number" data-sugyr="${i}" min="1990" max="2100" value="${sg.year}"></div>${sg.note?`<div class="small muted" style="margin:-2px 0 6px 28px">${esc(sg.note)}</div>`:''}`).join('')}
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-do="sugadd" type="button">Lägg till valda</button><button class="btn sec" data-do="sugskip" type="button">Hoppa över</button></div>
  </div>`;
}
function addSuggestions(){
  const box=$('#sugbox');if(!box||!suggest)return;
  let n=0;
  suggest.items.forEach((sg,i)=>{
    const cb=box.querySelector(`[data-sug="${i}"]`),yr=parseInt(box.querySelector(`[data-sugyr="${i}"]`).value,10);
    if(cb&&cb.checked&&yr>=1990&&yr<=2100){
      actions.push({id:uid(),standId:suggest.standId,status:'planerad',type:sg.type,sub:sg.sub,mix:null,year:yr,date:null,vol:null,note:(sg.note?sg.note+'. ':'')+'Förslag efter '+suggest.from,created:new Date().toISOString()});n++;
    }
  });
  suggest=null;saveActions();restyle();renderCard();renderActs();renderTable();renderData();
  toast(n?`${n} planerade åtgärder tillagda`:'Inga åtgärder valda');
}
function saveForm(){
  const f=$('#actform');if(!f)return;
  const v=n=>f.elements[n]?f.elements[n].value.trim():'';
  const status=f.elements.status.value;
  const type=v('type');
  if(!type){toast('Välj vilken åtgärd det gäller');return;}
  let sub='',mix=null;
  if(type==='Plantering'){
    sub=v('sub');if(!sub){toast('Välj trädslag');return;}
    if(sub==='Blandat'){
      const t=Number(v('mixTall'))||0,g=Number(v('mixGran'))||0,b=Number(v('mixBjork'))||0;
      if(t+g+b!==100){toast('Fördelningen måste bli 100 % (nu '+(t+g+b)+' %)');return;}
      mix={Tall:t,Gran:g,'Björk':b};
      sub='Blandat ('+[t&&`Tall ${t} %`,g&&`Gran ${g} %`,b&&`Björk ${b} %`].filter(Boolean).join(', ')+')';
    }
  }else if(type==='Markberedning'){
    sub=v('sub');if(!sub){toast('Välj metod');return;}
    if(sub==='Annat'){sub=v('other');if(!sub){toast('Ange metod');return;}}
  }else if(type==='Gallring'){
    sub=v('sub');if(!sub){toast('Välj gallringsstadium');return;}
  }else if(type==='Slutavverkning'){
    sub=v('sub');if(!sub){toast('Välj avverkningsform');return;}
  }else if(type==='Annat'){
    sub=v('other');if(!sub){toast('Beskriv åtgärden');return;}
  }
  let year=parseInt(v('year'),10);const date=status==='utford'?v('date'):'';
  if(date)year=parseInt(date.slice(0,4),10);
  if(!(year>=1990&&year<=2100)){toast('Ange ett giltigt år');return;}
  const vol=(VOL_TYPES.includes(type)&&v('vol')!=='')?Number(v('vol')):null;
  const rec={status,type,sub,mix,year,date:date||null,vol,note:v('note')};
  let saved;
  if(formState.aid){saved=actions.find(x=>x.id===formState.aid);Object.assign(saved,rec);suggest=null;}
  else{saved={id:uid(),standId:selId,created:new Date().toISOString(),...rec};actions.push(saved);
    const items=buildSuggestions(saved);
    suggest=items.length?{standId:selId,from:actLabel(saved)+' '+(saved.date||saved.year),items}:null;}
  saveActions();formState=null;
  restyle();renderCard();renderActs();renderTable();renderData();
  leaveForm();toast('Åtgärden sparades');
  const sb=$('#sugbox');if(sb&&sb.scrollIntoView)sb.scrollIntoView({block:'nearest'});
}

/* ---------- table tab ---------- */
let tSort={k:'fig',d:1},tText='',tGrp='';
const COLS=[['fig','Fig','n'],['id','Standid','n'],['ha','ha','n'],['grp','Grupp',''],['utv','Utv.klass',''],['tsl','Trädslag',''],['vol','m³/ha','n'],['tot','m³ tot','n'],['na','Åtg.','n']];
function rowsData(){
  return STANDS.features.map(f=>{const p=eff(f.properties.id);const a=actsFor(p.id);return {...p,tot:volTot(p),na:a.length,utv:p.utv||'',tsl:p.tsl||'',ed:!!edits[p.id]};});
}
function renderTable(){
  const el=$('#pane-table');
  let r=rowsData();
  if(tGrp)r=r.filter(x=>x.grp===tGrp);
  if(tText){const q=tText.toLowerCase();r=r.filter(x=>`${x.fig} ${x.id} ${x.grp} ${x.utv} ${x.tsl}`.toLowerCase().includes(q));}
  r.sort((a,b)=>{const x=a[tSort.k],y=b[tSort.k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'sv'))*tSort.d||(a.id-b.id);});
  const H=r.reduce((s,x)=>s+x.ha,0),V=r.reduce((s,x)=>s+x.tot,0);
  const focus=document.activeElement&&document.activeElement.id;
  el.innerHTML=`<div class="filters"><input id="tfilter" placeholder="Sök figur, standid, trädslag…" value="${esc(tText)}">

    <div style="overflow-x:auto"><table><thead><tr>${COLS.map(([k,n,c])=>`<th class="sort ${c}" data-sort="${k}">${n}${tSort.k===k?(tSort.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
    <tbody>${r.map(x=>`<tr class="click ${x.id===selId?'row-sel':''}" data-do="goto" data-sid="${x.id}"><td class="n">${x.fig}${x.ed?' ✎':''}</td><td class="n">${x.id}</td><td class="n">${nf(x.ha,2)}</td><td>${esc(x.grp)}</td><td>${esc(x.utv)}</td><td>${esc(x.tsl)}</td><td class="n">${nf(x.vol)}</td><td class="n">${nf(x.tot)}</td><td class="n">${x.na||''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2"><b>${r.length} st</b></td><td class="n"><b>${nf(H,1)}</b></td><td colspan="4"></td><td class="n"></td><td class="n"><b>${nf(V)}</b></td><td></td></tr></tfoot></table></div>`;
  $('#tfilter').oninput=e=>{tText=e.target.value;renderTable();const i=$('#tfilter');i.focus();i.setSelectionRange(i.value.length,i.value.length);};
  $('#tgrp').onchange=e=>{tGrp=e.target.value;renderTable();};
  el.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;tSort=tSort.k===k?{k,d:-tSort.d}:{k,d:1};renderTable();});
}

      planerade:pl.map(x=>`${x.year} ${actLabel(x)}`).join('; '),utforda:ut.map(x=>`${x.date||x.year} ${actLabel(x)}`).join('; '),antal_planerade:pl.length,antal_utforda:ut.length}};})};

/* ---------- event delegation ---------- */

  else if(d==='new'){formState={aid:null};editMode=false;renderCard();focusForm();}
  else if(d==='edit'){if(selId!==sid)select(sid,{zoom:true});formState={aid};renderCard();showTab('card');focusForm();}
  else if(d==='cancelform'){formState=null;renderCard();leaveForm();}
  else if(d==='saveform')saveForm();
  else if(d==='move'){moveAid=aid;refreshLists();}
  else if(d==='movecancel'){moveAid=null;refreshLists();}
  else if(d==='movey')applyMove(aid,parseInt(b.dataset.y,10),b.closest('[data-movebox]'));
  else if(d==='movesave'){const bx=b.closest('[data-movebox]');applyMove(aid,parseInt(bx.querySelector('.moveyr').value,10),bx);}
  else if(d==='sugadd')addSuggestions();
  else if(d==='sugskip'){suggest=null;renderCard();}
  else if(d==='testkey')testKey();

  else if(d==='editstand'){editMode=true;formState=null;renderCard();focusForm();}
  else if(d==='canceledit'){editMode=false;renderCard();leaveForm();}
  else if(d==='saveedit')saveEdit();

  else if(d==='wipeedits'){const n=Object.keys(edits).length;if(n&&confirm(`Återställa alla ${n} ändrade bestånd till laserdatan? Det går inte att ångra (ta backup först).`)){edits={};saveActions();editMode=false;afterEdit();toast('Alla bestånd återställda');}}
  else if(d==='del'){if(confirm('Ta bort åtgärden?')){actions=actions.filter(a=>a.id!==aid);saveActions();restyle();renderCard();renderActs();renderTable();renderData();}}

  else if(d==='savecfg'){const c=parseFbConfig($('#cfgtxt').value);if(!c){toast('Hittar inte apiKey och projectId i texten');return;}try{localStorage.setItem(CFG_LS,JSON.stringify(c));}catch(e){}location.reload();}
  else if(d==='clearcfg'){try{localStorage.removeItem(CFG_LS);}catch(e){}location.reload();}
  else if(d==='importstands'){const i=$('#standsfile');if(i)i.click();}
  else if(d==='signout'){if(CLOUD.api)CLOUD.api.signOut(CLOUD.auth);}
  else if(d==='clearkey'){applyKey('');renderData();toast('API-nyckeln togs bort');}
  else if(d==='loadbound')$('#boundfile').click();
  else if(d==='clearbound'){showUserBoundary(null);try{localStorage.removeItem('skogsplan:userboundary');}catch(e){}renderData();}
  else if(d==='wipe'){if(actions.length&&confirm(`Ta bort alla ${actions.length} åtgärder? Det går inte att ångra (ta backup först).`)){actions=[];saveActions();restyle();renderCard();renderActs();renderTable();renderData();}}
});
document.addEventListener('change',e=>{

/* ---------- Beståndsdata: ligger i den delade planen (bakom inloggning), inte i den publika filen ---------- */
const STANDS_CACHE='skogsplan:stands-cache';
function applyStands(fc){
  STANDS=fc;
  byId=new Map(fc.features.map(f=>[f.properties.id,f]));
  layers.clear();gj.clearLayers();gj.addData(fc);
  bounds=gj.getBounds();
  if(selId!=null&&!byId.has(selId))selId=null;
  restyle();renderCard();renderActs();renderTable();renderData();updateHeader();
  fit();
}
function convertStands(g){
  const feats=(g&&g.type==='FeatureCollection')?g.features:null;
  if(!feats||!feats.length)throw new Error('Filen innehåller inga bestånd');
  const p0=feats[0].properties||{};
  const ready=('id' in p0)&&('fig' in p0)&&('grp' in p0);        // redan i appens format
  const crsName=(g.crs&&g.crs.properties&&g.crs.properties.name)||'';
  const is3067=!ready&&(/3067/.test(crsName)||Math.abs(firstCoord(feats[0].geometry.coordinates)[0])>1000);
  const rd=x=>Math.round(x*1e6)/1e6,r1=x=>Math.round((Number(x)||0)*10)/10;
  const out=feats.map((f,i)=>{
    let t=f.geometry&&f.geometry.type,c=f.geometry&&f.geometry.coordinates;
    if(t==='Polygon'){c=[c];t='MultiPolygon';}
    if(t!=='MultiPolygon')throw new Error('Bestånd nr '+(i+1)+' saknar polygon');
    if(is3067)c=mapCoords(c,pt=>tm35ToLonLat(pt[0],pt[1]).map(rd));
    const p=f.properties||{};
    const props=ready?Object.assign({},p):{
      id:Number(p.Standid),fig:Number(p.Figurnummer),ha:Math.round((Number(p['Area, ha'])||0)*1000)/1000,
      grp:p.Huvudgrupp,utv:p.Utvecklingsklass??null,tsl:p['Trädslag']??null,
      fert:p.Fertilitetsklass??'',mark:p.Marktyp??'',dran:p['Dränering']??'',till:p['Tillgänglighet']??'',
      vol:r1(p.TreeStandSummary_Volume),timmer:r1(p.TreeStandSummary_SawLogVolume),massa:r1(p.TreeStandSummary_PulpWoodVolume),
      cutR:Number(p.CuttingRestriction)||0,silvR:Number(p.SilvicultureRestriction)||0};
    if(!Number.isFinite(props.id)||!Number.isFinite(props.fig))throw new Error('Bestånd nr '+(i+1)+' saknar Standid/Figurnummer');
    return {type:'Feature',geometry:{type:'MultiPolygon',coordinates:c},properties:props};
  });
  const ids=new Set(out.map(f=>f.properties.id));
  if(ids.size!==out.length)throw new Error('Samma Standid förekommer flera gånger i filen');
  return {type:'FeatureCollection',features:out};
}
async function uploadStands(fc){
  const M=CLOUD.api,db=CLOUD.db,txt=JSON.stringify(fc),SZ=200000,n=Math.ceil(txt.length/SZ);
  const id=i=>'p'+String(i).padStart(3,'0');
  await Promise.all(Array.from({length:n},(_,i)=>M.setDoc(M.doc(db,'plans',PROP,'stands',id(i)),{i,n,data:txt.slice(i*SZ,(i+1)*SZ),by:(CLOUD.user&&CLOUD.user.email)||'',at:Date.now()})));
  (CLOUD.remote.stands||[]).forEach(d=>{const m=/^p(\d+)$/.exec(d.id);if(m&&Number(m[1])>=n)M.deleteDoc(M.doc(db,'plans',PROP,'stands',d.id)).catch(()=>{});});
}
function applyStandsRemote(){
  if(STANDS_EMBEDDED)return;
  const docs=CLOUD.remote.stands||[];
  const first=docs.find(d=>d.id==='p000');
  if(!first||!first.data||!first.data.n)return;
  const n=first.data.n,parts=[];
  for(let i=0;i<n;i++){
    const d=docs.find(x=>x.id==='p'+String(i).padStart(3,'0'));
    if(!d||d.data.n!==n)return;                 // delar saknas ännu (uppladdning pågår)
    parts.push(d.data.data);
  }
  const txt=parts.join(''),sig=txt.length+':'+n+':'+txt.slice(-60);
  if(CLOUD.standsSig===sig)return;
  let fc;try{fc=JSON.parse(txt);}catch(e){return;}
  CLOUD.standsSig=sig;
  applyStands(fc);
  try{localStorage.setItem(STANDS_CACHE,txt);}catch(e){}
}
function standsSectionHTML(){
  const n=STANDS.features.length;
  const info=n?`${n} delar inlästa${STANDS_EMBEDDED?' (inbyggda i den här filen)':' från den delade planen'}.`:'Ingen beståndsdata inläst.';
  let more='';
  if(CLOUD.cfg&&CLOUD.user){
    more=`<p><button class="btn sec" data-do="importstands">Importera beståndsdata (.geojson eller .json)…</button><input type="file" id="standsfile" accept=".geojson,.json,application/json" hidden></p>
    <p class="small muted">Välj filen från landskapsregeringen eller den konverterade filen. Den laddas upp till den delade planen bakom inloggningen och syns direkt för er båda. Lägg inte filen på GitHub.</p>`;
  }else if(CLOUD.cfg){more='<p class="small muted">Logga in för att kunna importera beståndsdata.</p>';}
  return `<h3>Beståndsdata</h3><p class="small">${info}</p>${more}`;
}
function bindStandsImport(){
  const inp=$('#standsfile');if(!inp)return;
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const fc=convertStands(JSON.parse(r.result));
        const had=STANDS.features.length;
        if(had&&!confirm(`Ersätta dagens beståndsdata (${had} delar) med ${fc.features.length} delar från filen? Åtgärder och ändringar du lagt in ligger kvar.`))return;
        toast('Laddar upp beståndsdata…');
        await uploadStands(fc);
        toast(`Beståndsdata uppladdad (${fc.features.length} delar)`);
      }catch(err){toast('Kunde inte läsa filen: '+(err&&err.message||err));}
    };
    r.readAsText(file);
  };
}

/* ---------- Delad plan (Firebase): inloggning och synk mellan flera användare ---------- */
const FIREBASE_VER='12.17.1';
const FIREBASE_CONFIG_EMBEDDED={"apiKey": "AIzaSyCXy71I85lHotJYyyGB6dSrCMUBipLfsP0", "authDomain": "skogsbruksplan-73d0f.firebaseapp.com", "projectId": "skogsbruksplan-73d0f", "storageBucket": "skogsbruksplan-73d0f.firebasestorage.app", "messagingSenderId": "688922986747", "appId": "1:688922986747:web:d859186722fb2f8677885e"};   // Firebase-konfigurationen är inte hemlig – skyddet ligger i inloggningen och Firestore-reglerna
const CFG_LS='skogsplan:firebase';
const CLOUD={cfg:null,api:null,db:null,auth:null,user:null,synced:false,applying:false,err:null,
  got:{},meta:{},remote:{},sig:{},unsubs:[],last:{actions:new Map(),edits:new Map(),follow:'',map:''}};
const clean=o=>JSON.parse(JSON.stringify(o));
function stable(o){
  if(o===null||typeof o!=='object')return JSON.stringify(o);
  if(Array.isArray(o))return '['+o.map(stable).join(',')+']';
  return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+stable(o[k])).join(',')+'}';
}
const safeJSON=t=>{try{return JSON.parse(t);}catch(e){return {};}};
function parseFbConfig(txt){
  if(!txt)return null;
  const o={};let m;const re=/["']?(\w+)["']?\s*:\s*["']([^"']*)["']/g;
  while((m=re.exec(txt)))o[m[1]]=m[2];
  return(o.apiKey&&o.projectId)?o:null;
}
function getFbConfig(){
  if(FIREBASE_CONFIG_EMBEDDED)return FIREBASE_CONFIG_EMBEDDED;
  try{const s=localStorage.getItem(CFG_LS);return s?JSON.parse(s):null;}catch(e){return null;}
}
function showLogin(msg,o){
  o=o||{};
  $('#loginview').hidden=false;
  $('#loginmsg').textContent=msg||'';
  $('#loginform').style.display=o.busy?'none':'';
  $('#loginlocal').hidden=!o.fallback;
}
function hideLogin(){$('#loginview').hidden=true;}
function authMsg(e){
  const c=(e&&e.code)||'';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c))return 'Fel e-post eller lösenord.';
  if(/too-many-requests/.test(c))return 'För många försök. Vänta en stund och försök igen.';
  if(/network/.test(c))return 'Ingen internetanslutning.';
  return 'Inloggningen misslyckades ('+(c||'okänt fel')+').';
}
function cloudStatusText(){
  if(!CLOUD.cfg)return '';
  if(!CLOUD.user)return 'Ej inloggad';
  if(CLOUD.err)return 'Fel – '+CLOUD.err;
  const a=CLOUD.meta.actions;
  if(!navigator.onLine)return 'Offline (sparas på enheten)';
  if(a&&a.pending)return 'Sparar…';
  if(!CLOUD.synced)return 'Ansluter…';
  return 'Synkad ✓';
}
function updateCloudChip(){
  const el=$('#cloudchip');
  if(!CLOUD.cfg){el.hidden=true;return;}
  el.hidden=false;el.textContent=cloudStatusText();
  el.classList.toggle('bad',!!CLOUD.err);
}
function cloudErr(e){
  const c=(e&&e.code)||'';
  CLOUD.err=/permission/.test(c)?'ingen behörighet (kontrollera att din e-post finns i reglerna)':(c||'okänt fel');
  updateCloudChip();toast('Delningen fungerar inte: '+CLOUD.err);
}
async function loadFbModules(){
  const B='https://www.gstatic.com/firebasejs/'+FIREBASE_VER+'/';
  const r=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
  return Object.assign({},r[0],r[1],r[2]);
}
async function cloudBoot(){
  CLOUD.cfg=getFbConfig();
  updateCloudChip();
  if(!CLOUD.cfg)return;
  showLogin('Laddar…',{busy:true});
  let M;
  try{M=window.__FB_MODULES||await loadFbModules();}
  catch(e){showLogin('Kunde inte ladda inloggningen. Kontrollera internetanslutningen.',{fallback:true});return;}
  try{
    const app=M.initializeApp(CLOUD.cfg),auth=M.getAuth(app);
    let db;
    try{db=M.initializeFirestore(app,{localCache:M.persistentLocalCache({tabManager:M.persistentMultipleTabManager()})});}
    catch(e){db=M.getFirestore(app);}
    CLOUD.api=M;CLOUD.auth=auth;CLOUD.db=db;
    $('#loginform').onsubmit=async ev=>{
      ev.preventDefault();
      const em=$('#loginemail').value.trim(),pw=$('#loginpw').value;
      if(!em||!pw){$('#loginmsg').textContent='Fyll i e-post och lösenord.';return;}
      $('#loginmsg').textContent='Loggar in…';
      try{await M.signInWithEmailAndPassword(auth,em,pw);$('#loginmsg').textContent='';}
      catch(err){$('#loginmsg').textContent=authMsg(err);}
    };
    $('#loginlocal').onclick=()=>hideLogin();
    M.onAuthStateChanged(auth,user=>{user?onSignedIn(user):onSignedOut();});
  }catch(e){showLogin('Konfigurationen verkar vara fel ('+(e&&e.message||e)+').',{fallback:true});}
}
function onSignedIn(user){
  CLOUD.user=user;CLOUD.err=null;hideLogin();
  try{CLOUD.synced=localStorage.getItem('skogsplan:cloud-synced:'+user.uid)==='1';}catch(e){CLOUD.synced=false;}
  CLOUD.got={};CLOUD.meta={};CLOUD.remote={};CLOUD.sig={};
  const M=CLOUD.api,db=CLOUD.db,col=n=>M.collection(db,'plans',PROP,n),opts={includeMetadataChanges:true};
  CLOUD.unsubs=['actions','edits','settings','stands'].map(k=>M.onSnapshot(col(k),opts,snap=>onSnap(k,snap),cloudErr));
  updateCloudChip();renderData();
}
function onSignedOut(){
  CLOUD.unsubs.forEach(u=>{try{u();}catch(e){}});CLOUD.unsubs=[];
  CLOUD.user=null;CLOUD.synced=false;
  showLogin('');updateCloudChip();renderData();
}
function onSnap(kind,snap){
  CLOUD.err=null;
  CLOUD.meta[kind]={fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites};
  CLOUD.remote[kind]=snap.docs.map(d=>({id:d.id,data:d.data()}));
  if(kind==='stands'){applyStandsRemote();updateCloudChip();return;}
  if(!snap.metadata.fromCache)CLOUD.got[kind]=true;
  updateCloudChip();
  if(!CLOUD.synced){if(CLOUD.got.actions&&CLOUD.got.edits&&CLOUD.got.settings)firstSync();return;}
  applyRemote(kind);
}
function firstSync(){
  const rIds=new Set(CLOUD.remote.actions.map(d=>d.id)),rEd=new Set(CLOUD.remote.edits.map(d=>d.id));
  const localA=actions.filter(a=>!rIds.has(a.id)),localE=Object.entries(edits).filter(([k])=>!rEd.has(String(k)));
  let take=false;
  if(localA.length||localE.length){
    take=confirm(`Den här enheten har ${localA.length} åtgärder och ${localE.length} ändrade bestånd som inte finns i den delade planen. Ladda upp dem?`);
  }
  CLOUD.synced=true;
  try{localStorage.setItem('skogsplan:cloud-synced:'+CLOUD.user.uid,'1');}catch(e){}
  ['actions','edits','settings'].forEach(applyRemote);
  if(take){
    actions=actions.concat(localA);
    localE.forEach(([k,v])=>{edits[k]=v;});
    persistLocal();cloudPush();remoteRender();
  }
  updateCloudChip();
}
function applyRemote(kind){
  const docs=CLOUD.remote[kind]||[];
  const sig=stable(docs.map(d=>[d.id,d.data]));
  if(CLOUD.sig[kind]===sig)return false;
  CLOUD.sig[kind]=sig;
  CLOUD.applying=true;
  try{
    if(kind==='actions'){
      actions=docs.map(d=>Object.assign({},d.data,{id:d.id}));
      CLOUD.last.actions=new Map(actions.map(a=>[a.id,stable(clean(a))]));
    }else if(kind==='edits'){
      const o={};docs.forEach(d=>{o[d.id]=d.data;});
      edits=sanitizeEdits(o);
      CLOUD.last.edits=new Map(Object.entries(edits).map(([k,v])=>[String(k),stable(v)]));
    }else{
      const fol=docs.find(d=>d.id==='follow'),map=docs.find(d=>d.id==='map');
      followYrs=sanitizeFollow(fol&&fol.data&&fol.data.pairs?safeJSON(fol.data.pairs):{});
      CLOUD.last.follow=stable(followYrs);
      if(map&&map.data&&map.data.mmlKey){CLOUD.last.map=map.data.mmlKey;if(!mmlKey)applyKey(map.data.mmlKey);}
    }
  }finally{CLOUD.applying=false;}
  persistLocal();remoteRender();
  return true;
}
function remoteRender(){
  restyle();renderActs();renderTable();updateHeader();
  if(!(formState||editMode||moveAid||suggest))renderCard();
  const ae=document.activeElement;
  if(!(ae&&ae.closest&&ae.closest('#pane-data')))renderData();
}
function cloudPush(){
  if(!CLOUD.db||!CLOUD.user||!CLOUD.synced||CLOUD.applying)return;
  const M=CLOUD.api,db=CLOUD.db,fail=e=>cloudErr(e);
  const dref=(n,id)=>M.doc(db,'plans',PROP,n,id);
  const A=new Map(actions.map(a=>[a.id,stable(clean(a))]));
  A.forEach((js,id)=>{if(CLOUD.last.actions.get(id)!==js){CLOUD.last.actions.set(id,js);M.setDoc(dref('actions',id),JSON.parse(js)).catch(fail);}});
  [...CLOUD.last.actions.keys()].forEach(id=>{if(!A.has(id)){CLOUD.last.actions.delete(id);M.deleteDoc(dref('actions',id)).catch(fail);}});
  const E=new Map(Object.entries(edits).map(([k,v])=>[String(k),stable(clean(v))]));
  E.forEach((js,id)=>{if(CLOUD.last.edits.get(id)!==js){CLOUD.last.edits.set(id,js);M.setDoc(dref('edits',id),JSON.parse(js)).catch(fail);}});
  [...CLOUD.last.edits.keys()].forEach(id=>{if(!E.has(id)){CLOUD.last.edits.delete(id);M.deleteDoc(dref('edits',id)).catch(fail);}});
  const f=stable(followYrs);
  if(f!==CLOUD.last.follow){CLOUD.last.follow=f;M.setDoc(dref('settings','follow'),{pairs:f}).catch(fail);}
  if(mmlKey&&mmlKey!==BUILTIN_KEY&&mmlKey!==CLOUD.last.map){CLOUD.last.map=mmlKey;M.setDoc(dref('settings','map'),{mmlKey}).catch(fail);}
  updateCloudChip();
}

  if(!CLOUD.cfg){
    return `<h3>Delad plan</h3>
    <p class="small muted">Inloggning och gemensam åtgärdslogg för flera användare är inte påslagen. Klistra in Firebase-konfigurationen (raden med apiKey, projectId och så vidare) för att slå på den.</p>
    <textarea id="cfgtxt" rows="4" spellcheck="false" placeholder='const firebaseConfig = { apiKey: "…", authDomain: "…", projectId: "…", appId: "…" };' style="width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid #c4cbc0;border-radius:6px"></textarea>

}
