<style>
:root{--g:#2e5e3e;--g2:#e6efe8;--bg:#f4f6f2;--card:#fff;--line:#dde2d9;--ink:#1f2a22;--mut:#66706a;--warn:#b3261e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;padding:10px 16px;background:var(--g);color:#fff}
header h1{font-size:17px;margin:0;font-weight:650}
header .sub{opacity:.85;font-size:13px}
header .sum{margin-left:auto;font-size:13px;opacity:.95}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 410px}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0;background:#e6e9e2}
.mapctl{position:absolute;top:10px;right:10px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:grid;gap:6px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.15);max-width:210px}
.mapctl label{display:grid;gap:2px;color:var(--mut)}
.mapctl select,.mapctl input[type=range]{width:100%}
.mapctl .row{display:flex;gap:6px;align-items:center;color:var(--ink)}
.mapctl button{font:inherit}
.mapctl .row label{display:inline;color:var(--ink)}
.mapctl details{border-top:1px solid var(--line);padding-top:6px}
.mapctl summary{cursor:pointer;color:var(--mut);margin-bottom:4px}
.leaflet-popup-content{font:13px/1.4 system-ui,sans-serif;max-height:260px;overflow:auto}
.leaflet-bar.gpsctl a,.leaflet-touch .leaflet-bar.gpsctl a{display:flex;align-items:center;justify-content:center;width:30px;height:30px;line-height:1;padding:0;color:#444;background:#fff;cursor:pointer}
.gpsctl a svg{width:20px;height:20px;display:block}
.leaflet-bar.gpsctl a.on,.leaflet-touch .leaflet-bar.gpsctl a.on{background:#1e88e5;color:#fff}
.leaflet-bar.gpsctl a.follow,.leaflet-touch .leaflet-bar.gpsctl a.follow{background:#0d47a1;color:#fff}
#gpsinfo{position:absolute;right:10px;bottom:22px;z-index:1000;background:rgba(255,255,255,.96);border:1px solid #90caf9;border-radius:99px;padding:7px 12px;font:inherit;font-size:13px;color:#0d47a1;box-shadow:0 1px 6px rgba(0,0,0,.2);cursor:pointer;max-width:70%}
#cloudchip{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:99px;padding:2px 11px;font:inherit;font-size:12px;cursor:pointer}
#cloudchip.bad{background:#b3261e;border-color:#b3261e}
#loginview{position:fixed;inset:0;z-index:5000;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#loginview[hidden]{display:none}
.loginbox{width:100%;max-width:360px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 2px 14px rgba(0,0,0,.1);display:grid;gap:12px}
.loginbox label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.loginbox input{font:inherit;font-size:16px;padding:11px 12px;border:1px solid #c4cbc0;border-radius:8px;color:var(--ink)}
#loginmsg{font-size:13px;color:var(--warn);min-height:1.2em}
.rem{background:#fff;border:1px solid var(--line);border-left:4px solid #999;border-radius:8px;padding:8px 10px;margin:6px 0}
.rem .rt{font-weight:600}
.rem-red{border-left-color:#c62828;background:#fff6f5}
.rem-amber{border-left-color:#f9a825;background:#fffbea}
.rem-info{border-left-color:#1e88e5;background:#f4f9ff}
.rem .links{display:flex;gap:12px;margin-top:4px;font-size:12px}
.modal{position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:14px}
.modal[hidden]{display:none}
.modal .box{background:#fff;border-radius:12px;padding:18px;max-width:440px;width:100%;max-height:92vh;overflow:auto;display:grid;gap:12px}
.modal label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
.modal input,.modal select,.modal textarea{font:inherit;font-size:16px;padding:9px 10px;border:1px solid #c4cbc0;border-radius:6px;color:var(--ink);background:#fff;width:100%}
#drawbar{position:absolute;left:50%;transform:translateX(-50%);bottom:22px;z-index:1000;background:rgba(255,255,255,.97);border:1px solid #e91e63;border-radius:12px;padding:8px 10px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;box-shadow:0 1px 8px rgba(0,0,0,.25);max-width:94%}
#drawbar[hidden]{display:none}
#drawbar button{font:inherit;font-size:13px;padding:6px 10px;border-radius:7px;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer}
#drawbar button.go{background:var(--g);color:#fff}
#map.drawing,#map.drawing .leaflet-grab,#map.drawing .leaflet-interactive,#map.drawing.leaflet-dragging .leaflet-grab{cursor:crosshair !important}
.keyrow{display:flex;gap:6px;margin:6px 0}
.keyrow input{flex:1;min-width:0;font:inherit;padding:6px 8px;border:1px solid #c4cbc0;border-radius:6px}
#legend{position:absolute;left:10px;bottom:22px;z-index:1000;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 1px 6px rgba(0,0,0,.15)}
#legend .lgh{display:block;font:inherit;font-weight:700;background:none;border:0;padding:0;margin:0 0 4px;cursor:pointer;color:inherit;text-align:left}
#legend.closed .lgh{margin:0}
#legend div{display:flex;align-items:center;gap:6px;margin:2px 0}
#legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.2)}
aside{display:flex;flex-direction:column;min-height:0;background:var(--card);border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);background:#fafbf8}
.tab{flex:1;padding:10px 4px;border:0;background:none;font:inherit;cursor:pointer;color:var(--mut);border-bottom:3px solid transparent}
.tab[aria-selected=true]{color:var(--g);font-weight:650;border-bottom-color:var(--g);background:#fff}
.pane{flex:1;overflow:auto;padding:14px;display:none}
.pane.on{display:block}
h2{font-size:17px;margin:0 0 2px}
h2 small{font-weight:400;color:var(--mut);font-size:13px;margin-left:4px}
h3{font-size:13px;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--g2);font-size:12px}
.chip.planerad{background:#dcebfb;color:#0b4f8a}.chip.utford{background:#dff0e0;color:#1d5e22}
table{border-collapse:collapse;width:100%}
th,td{padding:5px 6px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--mut);font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.kv td:first-child{color:var(--mut);width:42%}
.muted{color:var(--mut)}
.small{font-size:12px}
button.btn{font:inherit;padding:6px 12px;border-radius:7px;border:1px solid var(--g);background:var(--g);color:#fff;cursor:pointer}
button.btn.sec{background:#fff;color:var(--g)}
button.btn.danger{background:#fff;color:var(--warn);border-color:var(--warn)}
button.lnk{font:inherit;border:0;background:none;color:var(--g);cursor:pointer;padding:0;text-decoration:underline}
button.lnk.red{color:var(--warn)}
form.act{background:#f6f9f6;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;display:grid;gap:8px}
form.act label{display:grid;gap:2px;font-size:12px;color:var(--mut)}
form.act input,form.act textarea,form.act select{font:inherit;padding:6px 8px;border:1px solid #c4cbc0;border-radius:6px;color:var(--ink);background:#fff;width:100%}
form.act .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.act .three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sugrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
.sugrow label{display:flex;align-items:center;gap:8px;font-size:14px}
.sugrow input[type=number]{width:96px;font:inherit;font-size:16px;padding:8px;border:1px solid #c4cbc0;border-radius:6px}
.sugrow input[type=checkbox]{width:20px;height:20px}
form.act .radios{display:flex;gap:14px;color:var(--ink);font-size:14px}
form.act .radios label{display:flex;gap:5px;align-items:center;color:var(--ink);font-size:14px}
form.act .radios input{width:auto}
.act-item{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:6px 0}
.act-item .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.act-item .links{display:flex;gap:12px;margin-top:4px;font-size:12px}
.row-sel{background:#fff8d9}
tr.click{cursor:pointer}tr.click:hover{background:#f3f6f1}
th.sort{cursor:pointer;user-select:none}
.filters{display:flex;gap:8px;margin-bottom:8px}
.filters input,.filters select{font:inherit;padding:5px 8px;border:1px solid #c4cbc0;border-radius:6px;min-width:0;flex:1}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2a22;color:#fff;padding:8px 14px;border-radius:8px;z-index:3000;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.leaflet-tooltip.figlabel{background:rgba(255,255,255,.88);border:0;box-shadow:none;padding:0 4px;font-weight:650;font-size:11px;color:#111;border-radius:3px}
.leaflet-tooltip.figlabel:before{display:none}
.hidelabels .figlabel{display:none}
#ctltoggle{display:none}
.sizebar{display:none}
aside.mini .pane,aside.mini .tabs{display:none}
#ctlbody{display:grid;gap:6px}
@media (max-width:860px){
 main{grid-template-columns:1fr;grid-template-rows:56% 44%}
 aside{border-left:0;border-top:1px solid var(--line)}
 header{padding:6px 12px;gap:2px 10px}
 header h1{font-size:15px}
 header .sub{display:none}
 header .sum{margin-left:auto;font-size:12px}
 .mapctl{max-width:230px;padding:6px 8px;max-height:calc(100% - 20px);overflow:auto}
 #ctltoggle{display:block;width:100%;padding:7px 10px}
 .mapctl.closed{padding:0;background:none;border:0;box-shadow:none}
 .mapctl.closed #ctlbody{display:none}
 .mapctl.closed #ctltoggle{background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.2);width:auto}
 #legend{font-size:11px;padding:5px 7px;max-height:45%;overflow:auto;bottom:18px}
 #legend div{margin:1px 0}
 .tab{padding:9px 2px;font-size:13px}
 .sizebar{display:flex;border-bottom:1px solid var(--line);background:#eef2ec}
 .sizebar button{flex:1;border:0;background:none;padding:9px 6px;font:inherit;font-size:13px;color:var(--g);font-weight:600;cursor:pointer}
 .sizebar button:disabled{opacity:.35}
 .sizebar button+button{border-left:1px solid var(--line)}
 form.act{padding:12px;gap:12px}
 form.act input,form.act textarea,form.act select{font-size:16px;padding:10px 12px}
 form.act textarea{min-height:90px}
 button.btn{padding:10px 16px}
 .pane{padding:12px 12px 90px}
}
</style>

<body>
<header>
  <h1>Skogsbruksplan</h1>
  <span class="sub">Fastighet 65-407-1-27 · underlag från Ålands landskapsregering</span>
  <span class="sum" id="hsum"></span>
  <button id="cloudchip" type="button" hidden></button>
</header>
<main>
  <div id="mapwrap">
    <div id="map"></div>
    <div class="mapctl" id="mapctl"><button id="ctltoggle" class="btn sec" type="button">Kartlager ▾</button><div id="ctlbody">
      <label>Bakgrundskarta
        <select id="basesel"><option value="sat">Satellit (Esri)</option><option value="mmlortho">Flygbild (Lantmäteriverket)</option><option value="mmltopo">Terrängkarta (Lantmäteriverket)</option><option value="osm">Gatukarta (OSM)</option><option value="none">Ingen</option></select>
      </label>
      <label>Färglägg efter
        <select id="themesel"></select>
      </label>
      <label>Fyllning
        <input type="range" id="opac" min="0" max="90" value="55">
      </label>
      <div class="row"><input type="checkbox" id="ovprop"><label for="ovprop">Fastighetsgränser</label></div>
      <div class="row"><input type="checkbox" id="ovids"><label for="ovids">Fastighetsbeteckningar</label></div>
      <details id="lrdet" open><summary>Landskapsregeringen</summary>
        <div class="row"><input type="checkbox" id="lrforn"><label for="lrforn">Fornminnen</label></div>
        <div class="row"><input type="checkbox" id="lrnat"><label for="lrnat">Naturreservat</label></div>
        <div class="row"><input type="checkbox" id="lrn2k"><label for="lrn2k">Natura 2000</label></div>
      </details>
      <button class="btn sec" id="drawbtn" type="button">Rita eget bestånd</button>
      <div class="row"><input type="checkbox" id="coordchk"><label for="coordchk">Koordinater vid klick/tryck</label></div>
      <div class="row"><input type="checkbox" id="lblchk" checked><label for="lblchk">Figurnummer (zooma in)</label></div>
      <button class="btn sec" id="fitbtn" type="button">Visa hela fastigheten</button>
    </div></div>
    <div id="legend"></div>
    <button id="gpsinfo" type="button" hidden></button>
    <div id="drawbar" hidden><span id="drawinfo" class="small"></span><button id="drawundo" type="button">Ångra</button><button id="drawgps" type="button">+ Min position</button><button id="drawdone" class="go" type="button">Klar</button><button id="drawcancel" type="button">Avbryt</button></div>
  </div>
  <aside>
    <div class="sizebar" id="sizebar"><button id="sizedown" type="button">▼ Mindre</button><button id="sizeup" type="button">▲ Maximera</button><button id="sizehide" type="button">Dölj meny ▾</button></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="card" aria-selected="true">Bestånd</button>
      <button class="tab" role="tab" data-tab="acts" aria-selected="false">Åtgärder</button>
      <button class="tab" role="tab" data-tab="table" aria-selected="false">Tabell</button>
      <button class="tab" role="tab" data-tab="data" aria-selected="false">Data</button>
    </div>
    <section class="pane on" id="pane-card"></section>
    <section class="pane" id="pane-acts"></section>
    <section class="pane" id="pane-table"></section>
    <section class="pane" id="pane-data"></section>
  </aside>
</main>
<div id="prepdlg" class="modal" hidden><div class="box" id="prepbox" style="max-width:580px"></div></div>
<div id="standdlg" class="modal" hidden><div class="box" id="standdlgbox"></div></div>
<div id="loginview" hidden>
  <div class="loginbox">
    <div><b style="font-size:18px">Skogsbruksplan</b><div class="small muted">Fastighet 65-407-1-27</div></div>
    <form id="loginform" style="display:grid;gap:12px">
      <label>E-post<input id="loginemail" type="email" autocomplete="username" inputmode="email"></label>
      <label>Lösenord<input id="loginpw" type="password" autocomplete="current-password"></label>
      <button class="btn" id="loginbtn" type="submit">Logga in</button>
    </form>

function mmlLayer(name,ext,opts){
  // Lantmäteriverkets öppna WMTS har kartrutor till och med nivå 16 (fastighetsgränser: nivå 12–16). Därefter förstoras rutorna.
  const l=L.tileLayer(MML+name+'/default/WGS84_Pseudo-Mercator/{z}/{y}/{x}.'+ext+'?api-key='+encodeURIComponent(mmlKey),
    {minZoom:0,maxNativeZoom:16,maxZoom:19,keepBuffer:1,attribution:'© Lantmäteriverket',...opts});
  l.on('tileerror',e=>{
    const t=e.tile;
    if(t&&!t._retried){            // tjänsten kan avvisa rutor vid hög belastning – försök en gång till
      t._retried=true;
      setTimeout(()=>{const u=t.src;t.src='';t.src=u+(u.includes('&r=1')?'':'&r=1');},600+Math.random()*700);
      return;
    }
    if(Date.now()-lastErr>15000){lastErr=Date.now();toast('Några kartrutor från Lantmäteriverket kunde inte hämtas. Testa nyckeln under Data.');}
  });
  return l;
}

/* egen fastighetsgräns (GeoJSON, WGS84 eller ETRS-TM35FIN) */
function tm35ToLonLat(E,N){
  const a=6378137,f=1/298.257222101,k0=0.9996,lon0=27*Math.PI/180,FE=500000;
  const n=f/(2-f),A=a/(1+n)*(1+n*n/4+n**4/64);
  const b=[n/2-2*n*n/3+37*n**3/96-n**4/360,n*n/48+n**3/15-437*n**4/1440,17*n**3/480-37*n**4/840,4397*n**4/161280];
  const d=[2*n-2*n*n/3-2*n**3,7*n*n/3-8*n**3/5,56*n**3/15,4279*n**4/630];
  const xi=N/(k0*A),eta=(E-FE)/(k0*A);
  let xi2=xi,eta2=eta;
  for(let j=1;j<=4;j++){xi2-=b[j-1]*Math.sin(2*j*xi)*Math.cosh(2*j*eta);eta2-=b[j-1]*Math.cos(2*j*xi)*Math.sinh(2*j*eta);}
  const chi=Math.asin(Math.sin(xi2)/Math.cosh(eta2));
  let phi=chi;for(let j=1;j<=4;j++)phi+=d[j-1]*Math.sin(2*j*chi);
  const lam=lon0+Math.atan2(Math.sinh(eta2),Math.cos(xi2));
  return [lam*180/Math.PI,phi*180/Math.PI];
}
function mapCoords(c,fn){return typeof c[0]==='number'?fn(c):c.map(x=>mapCoords(x,fn));}
function firstCoord(c){return typeof c[0]==='number'?c:firstCoord(c[0]);}

}
function toWgs84(gj){
  const feats=gj.type==='FeatureCollection'?gj.features:[gj.type==='Feature'?gj:{type:'Feature',properties:{},geometry:gj}];
  const sample=feats.map(f=>f.geometry&&f.geometry.coordinates).find(Boolean);
  if(!sample)throw new Error('Inga geometrier i filen');
  const crsName=(gj.crs&&gj.crs.properties&&gj.crs.properties.name)||'';
  const fc=firstCoord(sample);
  const is3067=/3067/.test(crsName)||Math.abs(fc[0])>1000;
  if(!is3067)return {type:'FeatureCollection',features:feats};
  return {type:'FeatureCollection',features:feats.map(f=>({type:'Feature',properties:f.properties||{},geometry:{type:f.geometry.type,coordinates:mapCoords(f.geometry.coordinates,c=>tm35ToLonLat(c[0],c[1]))}}))};
}

function tileBBox3857(x,y,z){const size=2*Math.PI*EARTH/Math.pow(2,z);const minx=-Math.PI*EARTH+x*size,maxy=Math.PI*EARTH-y*size;return [minx,maxy-size,minx+size,maxy];}

async function lrvFetch(k){
  const def=LRV_DEFS[k],b=(bounds&&bounds.isValid())?bounds.pad(0.5):map.getBounds();
  const env=[b.getWest(),b.getSouth(),b.getEast(),b.getNorth()].join(',');
  const out=[];

    const url=`${LR}${def.svc}/MapServer/${ly.id}/query?where=1%3D1&geometry=${env}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=true&outSR=4326&f=geojson`;
    const r=await fetch(url);

function lonLatToTm35(lon,lat){
  const a=6378137,f=1/298.257222101,k0=0.9996,lon0=27*Math.PI/180,FE=500000;
  const n=f/(2-f),A=a/(1+n)*(1+n*n/4+n**4/64),e=Math.sqrt(f*(2-f));
  const al=[n/2-2*n*n/3+5*n**3/16+41*n**4/180,13*n*n/48-3*n**3/5+557*n**4/1440,61*n**3/240-103*n**4/140,49561*n**4/161280];
  const phi=lat*Math.PI/180,lam=lon*Math.PI/180-lon0;
  const t=Math.sinh(Math.atanh(Math.sin(phi))-e*Math.atanh(e*Math.sin(phi)));
  const xi1=Math.atan2(t,Math.cos(lam)),eta1=Math.atanh(Math.sin(lam)/Math.sqrt(1+t*t));
  let xi=xi1,eta=eta1;
  for(let j=1;j<=4;j++){xi+=al[j-1]*Math.sin(2*j*xi1)*Math.cosh(2*j*eta1);eta+=al[j-1]*Math.cos(2*j*xi1)*Math.sinh(2*j*eta1);}
  return [FE+k0*A*eta,k0*A*xi];
}

  const sid=standAt(ll.lng,ll.lat),q=sid!=null?eff(sid):null;

    <button class="lnk" data-do="copytxt" data-txt="${esc(wgs)}">Kopiera WGS84</button> · <button class="lnk" data-do="copytxt" data-txt="${esc(tm)}">Kopiera TM35FIN</button></div>`;

function pip(pt,ring){
  let inside=false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi))inside=!inside;
  }
  return inside;
}
function polyContains(poly,pt){

}

const labelGroup=L.layerGroup().addTo(map);
function ptSegD2(px,py,ax,ay,bx,by){
  let x=ax,y=ay,dx=bx-x,dy=by-y;
  if(dx!==0||dy!==0){const t=((px-x)*dx+(py-y)*dy)/(dx*dx+dy*dy);if(t>1){x=bx;y=by;}else if(t>0){x+=dx*t;y+=dy*t;}}
  dx=px-x;dy=py-y;return dx*dx+dy*dy;
}
function ptPolyDist(px,py,rings){
  let inside=false,min=Infinity;
  for(const ring of rings){
    for(let i=0,j=ring.length-1;i<ring.length;j=i++){
      const a=ring[i],b=ring[j];
      if(((a[1]>py)!==(b[1]>py))&&(px<(b[0]-a[0])*(py-a[1])/(b[1]-a[1])+a[0]))inside=!inside;
      min=Math.min(min,ptSegD2(px,py,a[0],a[1],b[0],b[1]));
    }
  }
  return (inside?1:-1)*Math.sqrt(min);
}
function polyLabel(rings,prec){
  let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity;
  for(const p of rings[0]){minX=Math.min(minX,p[0]);minY=Math.min(minY,p[1]);maxX=Math.max(maxX,p[0]);maxY=Math.max(maxY,p[1]);}
  const w=maxX-minX,h=maxY-minY,cell=Math.min(w,h);
  if(cell===0)return [minX,minY];
  const mk=(x,y,hh)=>{const d=ptPolyDist(x,y,rings);return {x,y,h:hh,d,max:d+hh*Math.SQRT2};};
  let q=[],hh=cell/2;
  for(let x=minX;x<maxX;x+=cell)for(let y=minY;y<maxY;y+=cell)q.push(mk(x+hh,y+hh,hh));
  let best=mk(minX+w/2,minY+h/2,0);
  while(q.length){
    q.sort((a,b)=>b.max-a.max);
    const c=q.shift();
    if(c.d>best.d)best=c;
    if(c.max-best.d<=prec)continue;
    hh=c.h/2;
    q.push(mk(c.x-hh,c.y-hh,hh),mk(c.x+hh,c.y-hh,hh),mk(c.x-hh,c.y+hh,hh),mk(c.x+hh,c.y+hh,hh));
  }
  return [best.x,best.y];
}
function labelPoint(f){

  const lat0=big[0][0][1],k=Math.cos(lat0*Math.PI/180);
  const rings=big.map(r=>r.map(c=>[c[0]*k,c[1]]));
  const [x,y]=polyLabel(rings,1e-7);
  return [y,x/k];
}

/* ---------- Regler ur landskapsförordningen (1998:86) om skogsvård ---------- */
const SKOGSTYP=['Lund (lundartad)','Harsyre-blåbärstyp','Blåbärstyp','Lingontyp','Ljungtyp','Lavtyp'];
function maturityFor(tsl,st){
  if(!tsl||!st)return null;
  const rich=(st==='Lund (lundartad)'||st==='Harsyre-blåbärstyp');
  if(tsl==='Tall'){
    if(rich||st==='Blåbärstyp')return {dbh:29,age:80};
    if(st==='Lingontyp')return {dbh:27,age:90};
    if(st==='Ljungtyp')return {dbh:25,age:120};
    if(st==='Lavtyp')return {dbh:23,age:120};
  }
  if(tsl==='Gran'){if(rich)return {dbh:28,age:80};if(st==='Blåbärstyp')return {dbh:26,age:90};}
  if(tsl==='Vårtbjörk'){if(rich)return {dbh:28,age:60};if(st==='Blåbärstyp')return {dbh:26,age:65};}
  return null;
}
function standAgeInfo(id){
  const e=edits[id]||{},y=new Date().getFullYear();
  if(e.age!=null){const ref=e.ageYear||y;return {age:e.age+(y-ref),source:'angiven av dig'};}
  const pl=actsFor(id).filter(a=>a.type==='Plantering'&&a.status==='utford').sort((a,b)=>b.year-a.year)[0];
  if(pl)return {age:y-pl.year,source:'räknad från plantering '+pl.year};
  return null;
}
function dominantPlanted(a){
  if(a&&a.mix){const k=Object.entries(a.mix).sort((x,z)=>z[1]-x[1])[0];return k?k[0]:null;}
  return (a&&MAIN_TREES.includes(a.sub))?a.sub:null;
}
function maturityInfo(id){
  const p=eff(id),e=edits[id]||{},y=new Date().getFullYear();
  const tsl=p.tsl==='Björk'?'Vårtbjörk':p.tsl;
  const st=e.skogstyp||null,m=maturityFor(tsl,st),ai=standAgeInfo(id),dbh=e.dbh??null;
  let status='okänd',earliest=null;
  if(m){
    const dimOk=dbh!=null&&dbh>=m.dbh,ageOk=ai&&ai.age>=m.age;
    if(dimOk||ageOk)status='mogen';
    else if(ai||dbh!=null){status='ej';if(ai)earliest=y+(m.age-ai.age);}
  }
  return {tsl,st,m,ai,dbh,status,earliest};
}
function earliestFelling(id,act){
  const y=new Date().getFullYear(),st=(edits[id]||{}).skogstyp;
  let tsl=eff(id).tsl;
  if(act&&act.type==='Plantering'&&dominantPlanted(act))tsl=dominantPlanted(act);
  if(tsl==='Björk')tsl='Vårtbjörk';
  if(!st)return {year:null,why:'Ange skogstyp under Redigera uppgifter för att få tidigaste år för slutavverkning.'};
  const m=maturityFor(tsl,st);
  if(!m)return {year:null,why:`Förordningen anger ingen gräns för ${tsl||'okänt trädslag'} på ${st.toLowerCase()}, så ingen tidigaste tid kan föreslås.`};
  let age=null,base=y;
  if(act&&act.type==='Plantering'){age=0;base=act.year;}
  else{const ai=standAgeInfo(id);if(ai){age=ai.age;}}
  if(age==null)return {year:null,why:'Ange beståndets ålder under Redigera uppgifter för att få tidigaste år för slutavverkning.'};
  return {year:base+Math.max(0,m.age-age),note:`Tidigast vid ${m.age} års ålder eller ${m.dbh} cm medeldiameter (förordning 1998:86, 2 §). Åldern räknas här från planteringsåret.`};
}
function maturityHTML(id){
  const p=eff(id),mi=maturityInfo(id),e=edits[id]||{};
  if(p.grp==='Impediment')return `<h3>Impediment</h3><p class="small muted">Träd på bergsimpediment med lägre produktion än tvinmark kan vara en särskilt hänsynskrävande biotop (förordning 1998:86, 11 §). Kontrollera hur skyddet beaktas innan åtgärd.</p>`;
  let body;
  if(!mi.m){
    body=`<p class="small muted">${!e.skogstyp?'Ange <b>skogstyp</b> (och gärna ålder och medeldiameter) under Redigera uppgifter, så visar appen när beståndet är förnyelsemoget enligt landskapsförordningen om skogsvård.':`Förordningen anger ingen gräns för ${esc(mi.tsl||'det trädslaget')} på ${esc(e.skogstyp.toLowerCase())}. Ange trädslaget Vårtbjörk om det gäller vårtbjörk.`}</p>`;
  }else{
    const chip=mi.status==='mogen'?'<span class="chip utford">Förnyelsemoget</span>':mi.status==='ej'?`<span class="chip" style="background:#fff1c9">Inte förnyelsemoget${mi.earliest?' – tidigast '+mi.earliest:''}</span>`:'<span class="chip">Uppgift om ålder eller diameter saknas</span>';
    body=`<p class="small">${chip}</p><table class="kv">

/* ---------- Påminnelser ---------- */
const fmtDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function computeReminders(nowArg){
  const now=nowArg||new Date(),y=now.getFullYear(),R=[];
  const push=r=>{if(!remDone[r.key])R.push(r);};
  for(const a of actions){
    const p=eff(a.standId),lbl='Figur '+p.fig,fell=a.type==='Slutavverkning',big=p.ha>0.5;
    const base={standId:a.standId,aid:a.id};
    if(a.status==='planerad'){
      if(a.year<y)push({...base,key:'late:'+a.id+':'+a.year,level:'red',title:`Försenad: ${actLabel(a)} (${a.year})`,detail:`${lbl}. Flytta fram åtgärden eller markera den som utförd.`,sort:a.year});
      else if(a.year===y)push({...base,key:'now:'+a.id+':'+a.year,level:'amber',title:`Planerad i år: ${actLabel(a)}`,detail:lbl,sort:y+0.5});
      if(fell&&big){
        const pl=a.plan||{status:'Ej ansökt'},ay=pl.date?+pl.date.slice(0,4):null;
        if(pl.status!=='Godkänd'){
          if(a.year<=y+1)push({...base,key:'plan:'+a.id+':'+pl.status,level:a.year<=y?'red':'amber',title:'Förnyelseplan krävs före avverkning',detail:`${lbl}, ${nf(p.ha,2)} ha (över 0,5 ha). Status: ${pl.status}. Avverkning får inte börja före godkänd plan och mottaget beslut.`,sort:a.year});
        }else if(!pl.beslut&&a.year<=y+1){
          push({...base,key:'beslut:'+a.id,level:'amber',title:'Registrera när beslutet har kommit',detail:`${lbl}: planen är godkänd men inget mottaget beslut är registrerat. Avverkningen får inte påbörjas före beslutet är mottaget.`,sort:a.year});
        }else if(ay!=null&&a.year>ay+2){
          push({...base,key:'planexp:'+a.id+':'+pl.date,level:'amber',title:'Planens giltighet går ut före planerat år',detail:`${lbl}: godkänd ${pl.date}, gäller tre kalenderår (till och med ${ay+2}, min tolkning). Planerad avverkning ${a.year}.`,sort:a.year});
        }
      }
      if(fell){
        const mi=maturityInfo(a.standId);
        if(mi.m&&mi.status==='ej'&&mi.earliest!=null&&a.year<mi.earliest)push({...base,key:'mogen:'+a.id+':'+a.year,level:'amber',title:'Planerad avverkning före förnyelsemognad',detail:`${lbl}: tidigast ${mi.earliest} enligt ålder, eller när ${mi.m.dbh} cm medeldiameter uppnåtts.`,sort:a.year});
      }
      if(p.grp==='Impediment'&&['Slutavverkning','Gallring','Markberedning','Plantering'].includes(a.type))push({...base,key:'imp:'+a.id,level:'info',title:'Impediment – kontrollera biotopskydd',detail:`${lbl}: träd på bergsimpediment kan vara särskilt hänsynskrävande biotop.`,sort:a.year});
    }else{
      if(fell&&big&&a.year>=y-1&&!(a.plan&&a.plan.status==='Godkänd'))push({...base,key:'noplan:'+a.id,level:'red',title:'Utförd förnyelseavverkning utan registrerad godkänd plan',detail:`${lbl}: lägg in planens status på åtgärden, eller kontrollera med landskapsregeringen.`,sort:a.year});
      if(fell){
        const wantsPlant=a.fornyelse?/plantering/i.test(a.fornyelse):a.sub==='Kalyta';
        const nat=a.fornyelse?(/Naturlig/i.test(a.fornyelse)&&!wantsPlant):(a.sub==='Fröträdsställning'||a.sub==='Skärmställning');
        const planted=actions.some(b=>b.standId===a.standId&&b.type==='Plantering'&&b.status==='utford'&&b.year>=a.year);
        if(wantsPlant&&!planted&&y>=a.year+1){const dl=a.year+3;push({...base,key:'plant3:'+a.id,level:y>dl?'red':(y>=dl?'amber':'info'),title:`Plantering ska vara klar senast ${dl}`,detail:`${lbl}: tre år efter förnyelseavverkning ${a.year}. Ingen utförd plantering är registrerad.`,sort:dl});}
        if(nat&&!planted&&y>=a.year+5){const dl=a.year+7;push({...base,key:'nat7:'+a.id,level:y>dl?'red':'amber',title:`Kontrollera naturlig förnyelse senast ${dl}`,detail:`${lbl}: ett godtagbart plantbestånd ska ha uppstått inom sju år, annars ska beståndet förnyas eller kompletteras.`,sort:dl});}
      }
      if(a.type==='Plantering'){
        const dl=a.year+3;
        const ps=plotSummary(a.standId).plant;
        if(ps&&ps.lastYear>=a.year+1){
          if(!ps.ok)push({...base,key:'plantlow:'+a.id+':'+ps.lastDate,level:'red',title:'Plantbeståndet underskrider kravet – komplettera',detail:`${lbl}: ${nf(ps.avg.tot,0)} plantor/ha, gräns ${ps.req}/ha (${ps.main.toLowerCase()}). Kompletteringsplantering kan behövas.`,sort:a.year+3});
        }else if(y>=dl-1)push({...base,key:'chk3:'+a.id,level:y>dl?'red':(y>=dl?'amber':'info'),title:'Kontrollera plantbeståndet (tre år efter plantering)',detail:`${lbl}: planterat ${a.year}. Minst 1 600 tall, 1 400 gran eller 1 200 övriga utvecklingsdugliga plantor per ha ska finnas, annars ska du komplettera.`,sort:dl});
      }
      if((fell||a.type==='Gallring')&&a.date){
        const d=new Date(a.date),yr=d.getFullYear();
        const ty=p.tsl==='Tall'?{lim:new Date(yr,5,1),dead:new Date(yr,6,1),what:'Tallvirke'}:p.tsl==='Gran'?{lim:new Date(yr,6,1),dead:new Date(yr,7,1),what:'Granvirke'}:null;
        if(ty&&d<ty.lim){
          const left=Math.ceil((ty.dead-now)/86400000);
          if(left>=-60)push({...base,key:'timber:'+a.id,level:left<0?'red':(left<=14?'amber':'info'),title:`${ty.what} ska vara bortkört senast ${fmtDate(ty.dead)}`,detail:`${lbl}: avverkat ${a.date}. Gäller virke i gagnvirkesdimensioner. Alternativt täcks, barkas eller behandlas virket.`,sort:yr+left/1000});
        }
      }
    }
  }
  const ord={red:0,amber:1,info:2};
  return R.sort((a,b)=>(ord[a.level]-ord[b.level])||((a.sort||0)-(b.sort||0)));
}

function upcomingHTML(){
  const y=new Date().getFullYear();

  const groups=[['Försenade',a=>a.year<y,'#9c2018'],['I år ('+y+')',a=>a.year===y,'#1f2a22'],['Nästa år ('+(y+1)+')',a=>a.year===y+1,'#1f2a22'],['Senare',a=>a.year>y+1,'#1f2a22']];

  return h;
}

function buildSuggestions(a){
  const k2=a.type+'|'+(a.sub||'');
  const key=FOLLOW[k2]?k2:a.type;
  const rules=FOLLOW[key]||[];
  const out=[];sugHint='';
  rules.forEach((r,i)=>{
    let year,note=r.note||'';
    if(r.dyn==='mogen'){
      const m=earliestFelling(a.standId,a);
      if(m.year==null){sugHint=m.why;return;}
      year=Math.max(m.year,a.year+1);note=note||m.note;
    }else year=a.year+ruleYrs(key,i,r.yrs);
    out.push({type:r.type,sub:r.sub||'',year,note});
  });
  return out.filter(sg=>!actsFor(a.standId).some(x=>x.status==='planerad'&&x.type===sg.type&&(!sg.sub||x.sub===sg.sub)));
}

function saveForm(){
  const f=$('#actform');if(!f)return;
  const v=n=>f.elements[n]?f.elements[n].value.trim():'';
  const status=f.elements.status.value;
  const type=v('type');
  if(!type){toast('Välj vilken åtgärd det gäller');return;}
  let sub='',mix=null;
  if(type==='Plantering'){
    const mv={};let sum=0;
    [...MAIN_TREES,...SPECIAL_TREES].forEach(n=>{const x=Number(v('mix_'+n))||0;if(x>0){mv[n]=x;sum+=x;}});
    const ov=Number(v('mix_other'))||0;
    if(ov>0){mv['Annat: '+(v('mix_other_name')||'övrigt')]=ov;sum+=ov;}
    if(!sum){toast('Ange minst ett trädslag');return;}
    if(sum!==100){toast('Fördelningen måste bli 100 % (nu '+sum+' %)');return;}
    mix=mv;
    const ks=Object.keys(mv);
    sub=ks.length===1?ks[0].replace(/^Annat: /,''):ks.map(k=>`${k.replace(/^Annat: /,'')} ${mv[k]} %`).join(', ');
  }else if(type==='Markberedning'){
    sub=v('sub');if(!sub){toast('Välj metod');return;}
    if(sub==='Annat'){sub=v('other');if(!sub){toast('Ange metod');return;}}
  }else if(type==='Gallring'){
    sub=v('sub');if(!sub){toast('Välj gallringsstadium');return;}
  }else if(type==='Slutavverkning'){
    sub=v('sub');if(!sub){toast('Välj avverkningsform');return;}
  }else if(type==='Annat'){
    sub=v('other');if(!sub){toast('Beskriv åtgärden');return;}
  }
  let year=parseInt(v('year'),10);const date=status==='utford'?v('date'):'';
  if(date)year=parseInt(date.slice(0,4),10);
  if(!(year>=1990&&year<=2100)){toast('Ange ett giltigt år');return;}
  const vol=(VOL_TYPES.includes(type)&&v('vol')!=='')?Number(v('vol')):null;
  const plan=type==='Slutavverkning'?{status:v('planstatus')||'Ej ansökt',date:v('plandate')||null,beslut:v('planbeslut')||null,ref:v('planref')||''}:null;
  const rec={status,type,sub,mix,plan,year,date:date||null,vol,note:v('note'),avverkare:v('avverkare')||'',fornyelse:type==='Slutavverkning'?(v('fornyelse')||''):'',markb:type==='Slutavverkning'?(v('markb')||''):''};
  let saved;
  if(formState.aid){saved=actions.find(x=>x.id===formState.aid);Object.assign(saved,rec);suggest=null;}
  else{saved={id:uid(),standId:selId,created:new Date().toISOString(),...rec};actions.push(saved);
    const items=buildSuggestions(saved);
    suggest=(items.length||sugHint)?{standId:selId,from:actLabel(saved)+' '+(saved.date||saved.year),items,hint:sugHint}:null;}
  saveActions();formState=null;
  restyle();renderCard();renderActs();renderTable();renderData();
  leaveForm();toast('Åtgärden sparades');
  const sb=$('#sugbox');if(sb&&sb.scrollIntoView)sb.scrollIntoView({block:'nearest'});
}

/* ---------- actions tab ---------- */
let actFilter='alla';
function renderActs(){
  const el=$('#pane-acts');
  const curY=new Date().getFullYear();
  const list=actions.filter(a=>actFilter==='alla'||(actFilter==='forsenad'?(a.status==='planerad'&&a.year<curY):a.status===actFilter)).sort((a,b)=>(a.year-b.year)||(a.standId-b.standId));
  const sum=st=>{const s=new Set(actions.filter(a=>a.status===st).map(a=>a.standId));let ha=0;s.forEach(i=>ha+=baseOf(i).ha);return {n:actions.filter(a=>a.status===st).length,ha};};
  const pl=sum('planerad'),ut=sum('utford');
  el.innerHTML=`${remindersHTML()}<div class="filters"><select id="actfilter">
      <option value="alla">Alla åtgärder</option><option value="planerad">Planerade</option><option value="forsenad">Försenade</option><option value="utford">Utförda</option></select></div>
    <p class="small muted">Planerade: ${pl.n} st (berör ${nf(pl.ha,1)} ha) · Utförda: ${ut.n} st (berör ${nf(ut.ha,1)} ha). Försenade: ${actions.filter(a=>a.status==='planerad'&&a.year<curY).length} st. Arealen är hela beståndens areal.</p>
    ${list.length?list.map(a=>actItem(a,true)).join(''):'<p class="muted">Inga åtgärder inlagda ännu. Klicka på ett bestånd och välj “Lägg till åtgärd”.</p>'}`;
  $('#actfilter').value=actFilter;
  $('#actfilter').onchange=e=>{actFilter=e.target.value;renderActs();};
  updateRemBadge();
}

/* ---------- table tab ---------- */
let tSort={k:'fig',d:1},tText='',tGrp='';
const COLS=[['fig','Fig','n'],['id','Standid','n'],['ha','ha','n'],['grp','Grupp',''],['utv','Utv.klass',''],['tsl','Trädslag',''],['vol','m³/ha','n'],['tot','m³ tot','n'],['na','Åtg.','n']];
function rowsData(){
  return STANDS.features.map(f=>{const p=eff(f.properties.id);const a=actsFor(p.id);return {...p,tot:volTot(p),na:a.length,utv:p.utv||'',tsl:p.tsl||'',ed:!!edits[p.id]};});
}
function renderTable(){
  const el=$('#pane-table');
  if(tView==='forn'){renderFornView(el);return;}
  let r=rowsData();
  if(tGrp)r=r.filter(x=>x.grp===tGrp);
  if(tText){const q=tText.toLowerCase();r=r.filter(x=>`${x.fig} ${x.id} ${x.grp} ${x.utv} ${x.tsl}`.toLowerCase().includes(q));}
  r.sort((a,b)=>{const x=a[tSort.k],y=b[tSort.k];return (typeof x==='number'?x-y:String(x).localeCompare(String(y),'sv'))*tSort.d||(a.id-b.id);});
  const H=r.reduce((s,x)=>s+x.ha,0),V=r.reduce((s,x)=>s+x.tot,0);
  const focus=document.activeElement&&document.activeElement.id;
  el.innerHTML=`${tviewHTML()}<div class="filters"><input id="tfilter" placeholder="Sök figur, standid, trädslag…" value="${esc(tText)}">
    <select id="tgrp"><option value="">Alla grupper</option>${Object.keys(GRP).map(g=>`<option ${tGrp===g?'selected':''}>${g}</option>`).join('')}</select></div>
    <div style="overflow-x:auto"><table><thead><tr>${COLS.map(([k,n,c])=>`<th class="sort ${c}" data-sort="${k}">${n}${tSort.k===k?(tSort.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead>
    <tbody>${r.map(x=>`<tr class="click ${x.id===selId?'row-sel':''}" data-do="goto" data-sid="${x.id}"><td class="n">${x.fig}${x.ed?' ✎':''}</td><td class="n">${x.id}</td><td class="n">${nf(x.ha,2)}</td><td>${esc(x.grp)}</td><td>${esc(x.utv)}</td><td>${esc(x.tsl)}</td><td class="n">${nf(x.vol)}</td><td class="n">${nf(x.tot)}</td><td class="n">${x.na||''}</td></tr>`).join('')}</tbody>
    <tfoot><tr><td colspan="2"><b>${r.length} st</b></td><td class="n"><b>${nf(H,1)}</b></td><td colspan="4"></td><td class="n"></td><td class="n"><b>${nf(V)}</b></td><td></td></tr></tfoot></table></div>`;
  $('#tfilter').oninput=e=>{tText=e.target.value;renderTable();const i=$('#tfilter');i.focus();i.setSelectionRange(i.value.length,i.value.length);};
  $('#tgrp').onchange=e=>{tGrp=e.target.value;renderTable();};
  el.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{const k=th.dataset.sort;tSort=tSort.k===k?{k,d:-tSort.d}:{k,d:1};renderTable();});
}

/* ---------- data tab ---------- */
function csvCell(v){const s=String(v??'');return /[;"\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function exportCSV(){
  const head=['Fastighet','Standid','Figur','Areal ha','Huvudgrupp','Status','Åtgärd','Detalj','År','Datum','Uttag m3','Kommentar'];
  const rows=[...actions].sort((a,b)=>(a.year-b.year)||(a.standId-b.standId)).map(a=>{const p=eff(a.standId);
    return [PROP,p.id,p.fig,p.ha.toFixed(2).replace('.',','),p.grp,a.status==='utford'?'Utförd':'Planerad',a.type,a.sub||'',a.year,a.date||'',a.vol??'',a.note||''];});
  download(`atgarder_${PROP}.csv`,'\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8');
}
function exportBackup(){download(`skogsplan_backup_${PROP}_${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:5,property:PROP,saved:new Date().toISOString(),actions,edits,follow:followYrs,rem:remDone,plots,custom:customStands,contact},null,1),'application/json');}
function exportGeo(){
  const fc={type:'FeatureCollection',name:'bestand_'+PROP,features:STANDS.features.map(f=>{
    const p=eff(f.properties.id),base=f.properties,a=actsFor(p.id),pl=a.filter(x=>x.status==='planerad'),ut=a.filter(x=>x.status==='utford');
    return {type:'Feature',geometry:f.geometry,properties:{standid:p.id,figur:p.fig,areal_ha:p.ha,huvudgrupp:p.grp,utvklass:p.utv,tradslag:p.tsl,vol_m3_ha:p.vol,timmer_m3_ha:p.timmer,massa_m3_ha:p.massa,andrad:!!edits[p.id],laser_vol_m3_ha:base.vol,medelalder_ar:p.age??null,anteckning:p.note||'',
      planerade:pl.map(x=>`${x.year} ${actLabel(x)}`).join('; '),utforda:ut.map(x=>`${x.date||x.year} ${actLabel(x)}`).join('; '),antal_planerade:pl.length,antal_utforda:ut.length}};})};
  download(`bestand_med_atgarder_${PROP}.geojson`,JSON.stringify(fc),'application/geo+json');
}
function followRowsHTML(){
  return Object.entries(FOLLOW).flatMap(([key,rules])=>rules.map((r,i)=>{
    if(r.dyn)return `<div class="sugrow"><span class="small">Efter ${esc(key.split('|').join(' – '))} → ${esc(r.type+(r.sub?' – '+r.sub:''))}</span><span class="small muted">enligt förordningens tabell</span></div>`;
    const val=ruleYrs(key,i,r.yrs);
    return `<div class="sugrow"><span class="small">Efter ${esc(key.split('|').join(' – '))} → ${esc(r.type+(r.sub?' – '+r.sub:''))}</span><span style="white-space:nowrap"><input type="number" min="0" max="100" step="1" inputmode="numeric" data-rule="${esc(key)}#${i}" value="${val}"> år</span></div>`;
  })).join('');
}

  bindStandsImport();

      renderData();toast('Fastighetsgränsen inläst');

  };
  $('#restorefile').onchange=e=>{
    const file=e.target.files[0];if(!file)return;

    r.onload=()=>{try{

      const ok=o.actions.filter(a=>Number.isFinite(a.standId)&&a.type&&(a.status==='planerad'||a.status==='utford'));
      const ne=sanitizeEdits(o.edits);
      if((actions.length||Object.keys(edits).length)&&!confirm(`Ersätta dina ${actions.length} åtgärder och ${Object.keys(edits).length} ändrade bestånd med innehållet i backupen (${ok.length} åtgärder, ${Object.keys(ne).length} ändrade bestånd)?`))return;

  };
}

/* ---------- event delegation ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do]');if(!b)return;
  const d=b.dataset.do,sid=b.dataset.sid?+b.dataset.sid:null,aid=b.dataset.aid;
  if(d==='goto')select(sid,{zoom:true});
  else if(d==='clearsel'){selId=null;formState=null;editMode=false;restyle();renderCard();renderTable();}
  else if(d==='new'){formState={aid:null};editMode=false;renderCard();focusForm();}
  else if(d==='edit'){if(selId!==sid)select(sid,{zoom:true});formState={aid};renderCard();showTab('card');focusForm();}
  else if(d==='cancelform'){formState=null;renderCard();leaveForm();}
  else if(d==='saveform')saveForm();
  else if(d==='move'){moveAid=aid;refreshLists();}
  else if(d==='movecancel'){moveAid=null;refreshLists();}
  else if(d==='movey')applyMove(aid,parseInt(b.dataset.y,10),b.closest('[data-movebox]'));
  else if(d==='movesave'){const bx=b.closest('[data-movebox]');applyMove(aid,parseInt(bx.querySelector('.moveyr').value,10),bx);}
  else if(d==='sugadd')addSuggestions();
  else if(d==='sugskip'){suggest=null;renderCard();}
  else if(d==='prep')prepOpen(aid);
  else if(d==='prepclose'){prepCollect();$('#prepdlg').hidden=true;if(Object.keys(contact).length)saveActions();}
  else if(d==='prepsave')prepSaveDraft();
  else if(d==='prepdel'){prepCollect();prep.figs=prep.figs.filter(i=>i!==+b.dataset.sid);if(!prep.figs.length)prep.figs=[actions.find(x=>x.id===prep.aid).standId];renderPrep();}
  else if(d==='prepadd'){prepCollect();const n=($('#pd_addfig').value||'').split(/[ ,;]+/).map(x=>x.trim()).filter(Boolean);let added=0;n.forEach(x=>STANDS.features.forEach(f=>{if(String(f.properties.fig)===x&&!prep.figs.includes(f.properties.id)){prep.figs.push(f.properties.id);added++;}}));renderPrep();toast(added?`${added} delar tillagda`:'Hittade ingen figur med det numret');}
  else if(d==='prepcopy'){copyText(prepText());}
  else if(d==='prepdl'){download(`underlag_atgardsansokan_${PROP}.txt`,'\ufeff'+prepText(),'text/plain;charset=utf-8');}
  else if(d==='prepgeo'){prepCollect();prepGeo();}
  else if(d==='tview'){tView=b.dataset.v;renderTable();if(tView==='forn'&&!prefs.forn&&!LRV.data.forn){/* visa knapp */}}
  else if(d==='loadforn'){setLR('forn',true);renderTable();}
  else if(d==='fornto')fornTo(+b.dataset.i);
  else if(d==='newplot'){plotForm={kind:b.dataset.kind,pid:null,standId:selId};renderCard();}
  else if(d==='editplot'){const p=plots.find(x=>x.id===b.dataset.pid);if(p){plotForm={kind:p.kind,pid:p.id,standId:p.standId};renderCard();}}
  else if(d==='delplot'){if(confirm('Ta bort provytan?')){plots=plots.filter(x=>x.id!==b.dataset.pid);saveActions();renderCard();renderActs();}}
  else if(d==='saveplot')savePlot();
  else if(d==='cancelplot'){plotForm=null;renderCard();}
  else if(d==='plotgps'){const f=$('#plotform');if(!f)return;if(!gpsLast){toast('Slå på GPS-knappen på kartan först');return;}f.elements.pl_lat.value=gpsLast[0].toFixed(6);f.elements.pl_lon.value=gpsLast[1].toFixed(6);toast('Position inlagd');}
  else if(d==='useg'){const S=plotSummary(selId);if(S.rel){edits[selId]=Object.assign({},edits[selId]||{},{g:Math.round(S.rel.tot*10)/10});saveActions();afterEdit();toast('Grundytan sparades på beståndet');}}
  else if(d==='exportplots')exportPlots();
  else if(d==='savecustom')saveCustomStand();
  else if(d==='closestanddlg'){$('#standdlg').hidden=true;}
  else if(d==='delcustom'){const c=customStands.find(x=>x.id===selId);if(c&&confirm('Ta bort det egna beståndet? Åtgärder och provytor på det ligger kvar men syns som okänt bestånd.')){customStands=customStands.filter(x=>x.id!==selId);selId=null;saveActions();applyStands();toast('Beståndet togs bort');}}
  else if(d==='copytxt')copyText(b.dataset.txt);
  else if(d==='remdone'){remDone[b.dataset.key]=new Date().toISOString().slice(0,10);saveActions();renderActs();renderCard();}
  else if(d==='showacts'){showTab('acts');}
  else if(d==='showplanned'){actFilter='planerad';renderActs();showTab('acts');}
  else if(d==='testkey')testKey();
  else if(d==='resetfollow'){followYrs={};saveActions();renderData();toast('Standardintervallen är återställda');}
  else if(d==='editstand'){editMode=true;formState=null;renderCard();focusForm();}
  else if(d==='canceledit'){editMode=false;renderCard();leaveForm();}
  else if(d==='saveedit')saveEdit();
  else if(d==='resetstand'){if(confirm('Återställa beståndet till laserdatan? Dina ändringar för det här beståndet tas bort.')){delete edits[selId];saveActions();editMode=false;afterEdit();leaveForm();toast('Återställt till laserdata');}}
  else if(d==='wipeedits'){const n=Object.keys(edits).length;if(n&&confirm(`Återställa alla ${n} ändrade bestånd till laserdatan? Det går inte att ångra (ta backup först).`)){edits={};saveActions();editMode=false;afterEdit();toast('Alla bestånd återställda');}}

/* ---------- Beståndsdata: ligger i den delade planen (bakom inloggning), inte i den publika filen ---------- */
const STANDS_CACHE='skogsplan:stands-cache';
let BASE_STANDS={type:'FeatureCollection',features:[]};
function customFeatures(){
  return customStands.map(c=>({type:'Feature',geometry:{type:'MultiPolygon',coordinates:[[c.ring.concat([c.ring[0]])]]},properties:{...c.props,id:c.id,custom:true}}));
}
function applyStands(fc){
  if(fc)BASE_STANDS=fc;
  const all={type:'FeatureCollection',features:BASE_STANDS.features.concat(customFeatures())};
  STANDS=all;
  byId=new Map(all.features.map(f=>[f.properties.id,f]));
  layers.clear();gj.clearLayers();gj.addData(all);rebuildLabels(all);
  bounds=all.features.length?gj.getBounds():null;
  if(selId!=null&&!byId.has(selId))selId=null;
  restyle();renderCard();renderActs();renderTable();renderData();updateHeader();
  if(fc||!bounds)fit();
}
function convertStands(g){
  const feats=(g&&g.type==='FeatureCollection')?g.features:null;
  if(!feats||!feats.length)throw new Error('Filen innehåller inga bestånd');
  const p0=feats[0].properties||{};
  const ready=('id' in p0)&&('fig' in p0)&&('grp' in p0);        // redan i appens format
  const crsName=(g.crs&&g.crs.properties&&g.crs.properties.name)||'';
  const is3067=!ready&&(/3067/.test(crsName)||Math.abs(firstCoord(feats[0].geometry.coordinates)[0])>1000);
  const rd=x=>Math.round(x*1e6)/1e6,r1=x=>Math.round((Number(x)||0)*10)/10;
  const out=feats.map((f,i)=>{
    let t=f.geometry&&f.geometry.type,c=f.geometry&&f.geometry.coordinates;
    if(t==='Polygon'){c=[c];t='MultiPolygon';}
    if(t!=='MultiPolygon')throw new Error('Bestånd nr '+(i+1)+' saknar polygon');
    if(is3067)c=mapCoords(c,pt=>tm35ToLonLat(pt[0],pt[1]).map(rd));
    const p=f.properties||{};
    const props=ready?Object.assign({},p):{
      id:Number(p.Standid),fig:Number(p.Figurnummer),ha:Math.round((Number(p['Area, ha'])||0)*1000)/1000,
      grp:p.Huvudgrupp,utv:p.Utvecklingsklass??null,tsl:p['Trädslag']??null,
      fert:p.Fertilitetsklass??'',mark:p.Marktyp??'',dran:p['Dränering']??'',till:p['Tillgänglighet']??'',
      vol:r1(p.TreeStandSummary_Volume),timmer:r1(p.TreeStandSummary_SawLogVolume),massa:r1(p.TreeStandSummary_PulpWoodVolume),
      cutR:Number(p.CuttingRestriction)||0,silvR:Number(p.SilvicultureRestriction)||0};
    if(!Number.isFinite(props.id)||!Number.isFinite(props.fig))throw new Error('Bestånd nr '+(i+1)+' saknar Standid/Figurnummer');
    return {type:'Feature',geometry:{type:'MultiPolygon',coordinates:c},properties:props};
  });
  const ids=new Set(out.map(f=>f.properties.id));
  if(ids.size!==out.length)throw new Error('Samma Standid förekommer flera gånger i filen');
  return {type:'FeatureCollection',features:out};
}
async function uploadStands(fc){
  const M=CLOUD.api,db=CLOUD.db,txt=JSON.stringify(fc),SZ=200000,n=Math.ceil(txt.length/SZ);
  const id=i=>'p'+String(i).padStart(3,'0');
  await Promise.all(Array.from({length:n},(_,i)=>M.setDoc(M.doc(db,'plans',PROP,'stands',id(i)),{i,n,data:txt.slice(i*SZ,(i+1)*SZ),by:(CLOUD.user&&CLOUD.user.email)||'',at:Date.now()})));
  (CLOUD.remote.stands||[]).forEach(d=>{const m=/^p(\d+)$/.exec(d.id);if(m&&Number(m[1])>=n)M.deleteDoc(M.doc(db,'plans',PROP,'stands',d.id)).catch(()=>{});});
}
function applyStandsRemote(){
  if(STANDS_EMBEDDED)return;
  const docs=CLOUD.remote.stands||[];
  const first=docs.find(d=>d.id==='p000');
  if(!first||!first.data||!first.data.n)return;
  const n=first.data.n,parts=[];
  for(let i=0;i<n;i++){
    const d=docs.find(x=>x.id==='p'+String(i).padStart(3,'0'));
    if(!d||d.data.n!==n)return;                 // delar saknas ännu (uppladdning pågår)
    parts.push(d.data.data);
  }
  const txt=parts.join(''),sig=txt.length+':'+n+':'+txt.slice(-60);
  if(CLOUD.standsSig===sig)return;
  let fc;try{fc=JSON.parse(txt);}catch(e){return;}
  CLOUD.standsSig=sig;
  applyStands(fc);
  try{localStorage.setItem(STANDS_CACHE,txt);}catch(e){}
}
function standsSectionHTML(){
  const n=STANDS.features.length;
  const info=n?`${n} delar inlästa${STANDS_EMBEDDED?' (inbyggda i den här filen)':' från den delade planen'}.`:'Ingen beståndsdata inläst.';
  let more='';
  if(CLOUD.cfg&&CLOUD.user){
    more=`<p><button class="btn sec" data-do="importstands">Importera beståndsdata (.geojson eller .json)…</button><input type="file" id="standsfile" accept=".geojson,.json,application/json" hidden></p>
    <p class="small muted">Välj filen från landskapsregeringen eller den konverterade filen. Den laddas upp till den delade planen bakom inloggningen och syns direkt för er båda. Lägg inte filen på GitHub.</p>`;
  }else if(CLOUD.cfg){more='<p class="small muted">Logga in för att kunna importera beståndsdata.</p>';}
  return `<h3>Beståndsdata</h3><p class="small">${info}</p>${more}`;
}
function bindStandsImport(){
  const inp=$('#standsfile');if(!inp)return;
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const r=new FileReader();
    r.onload=async()=>{
      try{
        const fc=convertStands(JSON.parse(r.result));
        const had=STANDS.features.length;
        if(had&&!confirm(`Ersätta dagens beståndsdata (${had} delar) med ${fc.features.length} delar från filen? Åtgärder och ändringar du lagt in ligger kvar.`))return;
        toast('Laddar upp beståndsdata…');
        await uploadStands(fc);
        toast(`Beståndsdata uppladdad (${fc.features.length} delar)`);
      }catch(err){toast('Kunde inte läsa filen: '+(err&&err.message||err));}
    };
    r.readAsText(file);
  };
}

let plotForm=null;
const PSP=['Tall','Gran','Björk','Övrigt'];
const todayStr=()=>new Date().toISOString().slice(0,10);
const plotsFor=id=>plots.filter(p=>p.standId===id).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
function relG(p){const c=p.counts||{},g={};let tot=0;PSP.forEach(k=>{const x=(Number(c[k])||0)*(Number(p.baf)||0);g[k]=x;tot+=x;});return {g,tot};}
function plantHa(p){const area=Math.PI*(Number(p.radius)||0)**2,c=p.counts||{},per={};let tot=0;PSP.forEach(k=>{const x=area?(Number(c[k])||0)*10000/area:0;per[k]=x;tot+=x;});return {per,tot,area};}
function plotSummary(id){
  const L=plotsFor(id),rel=L.filter(p=>p.kind==='relaskop'),pl=L.filter(p=>p.kind==='plant');
  const out={rel:null,plant:null};
  if(rel.length){const g={};PSP.forEach(k=>g[k]=0);let t=0;rel.forEach(p=>{const r=relG(p);t+=r.tot;PSP.forEach(k=>g[k]+=r.g[k]);});out.rel={n:rel.length,tot:t/rel.length,g:Object.fromEntries(PSP.map(k=>[k,g[k]/rel.length]))};}
  if(pl.length){
    const per={};PSP.forEach(k=>per[k]=0);let t=0;pl.forEach(p=>{const r=plantHa(p);t+=r.tot;PSP.forEach(k=>per[k]+=r.per[k]);});
    const avg={tot:t/pl.length,per:Object.fromEntries(PSP.map(k=>[k,per[k]/pl.length]))};
    const main=PSP.slice().sort((a,b)=>avg.per[b]-avg.per[a])[0],req=main==='Tall'?1600:main==='Gran'?1400:1200;
    const lastDate=pl.map(p=>p.date||'').sort().pop()||'';
    out.plant={n:pl.length,avg,main,req,ok:avg.tot>=req,near:avg.tot<req&&avg.tot>=req-200,lastYear:+lastDate.slice(0,4)||0,lastDate};
  }
  return out;
}

let drawPts=[],drawRedo=[],drawPoly=null;
const drawDots=L.layerGroup().addTo(map);
function ringAreaHa(ring){
  const lat0=ring.reduce((a,p)=>a+p[1],0)/ring.length,lon0=ring[0][0],kx=111320*Math.cos(lat0*Math.PI/180),ky=110574;
  let a=0;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const x1=(ring[j][0]-lon0)*kx,y1=(ring[j][1]-lat0)*ky,x2=(ring[i][0]-lon0)*kx,y2=(ring[i][1]-lat0)*ky;
    a+=x1*y2-x2*y1;
  }
  return Math.abs(a)/2/10000;
}
function updateDraw(){

const LR_CATS=['Klenare gallring','Grövre gallring','Avlägsnande av överståndare','Avverkning och plantering','Avverkning för naturlig förnyelse (fröträd/skärmställning)','Avverkning för naturlig förnyelse + plantering','Annat'];
function lrCategory(a){
  if(a.type==='Gallring')return a.sub==='Förstagallring'?'Klenare gallring':'Grövre gallring';
  if(a.type==='Avlägsnande av överståndare')return 'Avlägsnande av överståndare';
  if(a.type==='Slutavverkning'){
    const fo=a.fornyelse||(a.sub==='Kalyta'?'Plantering':'Naturlig förnyelse');
    if(fo==='Plantering')return 'Avverkning och plantering';
    if(fo==='Naturlig förnyelse + plantering')return 'Avverkning för naturlig förnyelse + plantering';
    return 'Avverkning för naturlig förnyelse (fröträd/skärmställning)';
  }
  return 'Annat';
}
const PREP_TYPES=['Gallring','Avlägsnande av överståndare','Slutavverkning'];
function geomRings(g){if(!g)return [];if(g.type==='Polygon')return [g.coordinates[0]];if(g.type==='MultiPolygon')return g.coordinates.map(p=>p[0]);return [];}
function standRings(id){const f=byId.get(id);return f?f.geometry.coordinates.map(p=>p[0]):[];}
function ringBox(r){let a=1e9,b=1e9,c=-1e9,d=-1e9;r.forEach(p=>{a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);});return [a,b,c,d];}
function segCross(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);return o(c,d,a)*o(c,d,b)<0&&o(a,b,c)*o(a,b,d)<0;}
function ringsOverlap(A,B){
  const x=ringBox(A),y=ringBox(B);
  if(x[0]>y[2]||y[0]>x[2]||x[1]>y[3]||y[1]>x[3])return false;
  if(A.some(p=>pip(p,B))||B.some(p=>pip(p,A)))return true;
  for(let i=0;i<A.length;i++)for(let j=0;j<B.length;j++)if(segCross(A[i],A[(i+1)%A.length],B[j],B[(j+1)%B.length]))return true;
  return false;
}
function protectChecks(ids){
  const out=[],fd=LRV.data.forn;
  if(!fd)out.push('Fornminnen: kartlagret är inte laddat. Slå på Fornminnen under Kartlager och öppna underlaget igen.');
  else{
    const near=[];
    fd.filter(f=>f.__layer.kind==='obj').forEach((f,i)=>{const c=featCenter(f),d=minDistToStands(c.lat,c.lng,ids);if(d<=100)near.push(`${fornTitle(f.properties,i)} (${Math.round(d)} m)`);});
    out.push(near.length?`Fornminnen inom 100 m från valda figurer: ${near.join('; ')}.`:'Inga fornminnen inom 100 m från valda figurer enligt kartlagret.');
  }
  const sr=ids.flatMap(id=>standRings(id));
  [['nat','Naturreservat'],['n2k','Natura 2000']].forEach(([k,name])=>{
    const dt=LRV.data[k];
    if(!dt){out.push(`${name}: kartlagret är inte laddat.`);return;}
    const hit=[];dt.forEach(f=>{if(geomRings(f.geometry).some(R=>sr.some(S=>ringsOverlap(S,R))))hit.push(fornTitle(f.properties,0,name));});
    out.push(hit.length?`${name} överlappar valda figurer: ${hit.join('; ')}.`:`Ingen överlappning med ${name.toLowerCase()} enligt kartlagret.`);
  });
  if(ids.some(i=>eff(i).grp==='Impediment'))out.push('Impediment ingår: träd på bergsimpediment kan vara särskilt hänsynskrävande biotop (förordning 1998:86, 11 §).');
  return out;
}

  CLOUD.user=null;CLOUD.synced=false;
  showLogin('');updateCloudChip();renderData();
}
const ARR={
  actions:{col:'actions',get:()=>actions,set:v=>{actions=v;},toDoc:a=>clean(a),fromDoc:(d,id)=>Object.assign({},d,{id})},
  plots:{col:'plots',get:()=>plots,set:v=>{plots=sanitizePlots(v);},toDoc:p=>clean(p),fromDoc:(d,id)=>Object.assign({},d,{id})},
  custom:{col:'custom',get:()=>customStands,set:v=>{customStands=sanitizeCustom(v);},toDoc:c=>({id:c.id,ring:JSON.stringify(c.ring),props:clean(c.props),created:c.created||''}),
    fromDoc:(d,id)=>({id:Number(d.id)||Number(id),ring:(()=>{try{return JSON.parse(d.ring);}catch(e){return [];}})(),props:d.props||{},created:d.created||''})}
};
function onSnap(kind,snap){
  CLOUD.err=null;
  CLOUD.meta[kind]={fromCache:snap.metadata.fromCache,pending:snap.metadata.hasPendingWrites};
  CLOUD.remote[kind]=snap.docs.map(d=>({id:d.id,data:d.data()}));
  if(kind==='stands'){applyStandsRemote();updateCloudChip();return;}
  if(!snap.metadata.fromCache)CLOUD.got[kind]=true;
  updateCloudChip();
  if(!CLOUD.synced){if(['actions','edits','settings','plots','custom'].every(k=>CLOUD.got[k]))firstSync();return;}
  applyRemote(kind);
}
function firstSync(){
  const loc={};let nloc=0;
  for(const k of Object.keys(ARR)){
    const ids=new Set((CLOUD.remote[k]||[]).map(d=>String(d.id)));
    loc[k]=ARR[k].get().filter(x=>!ids.has(String(x.id)));nloc+=loc[k].length;
  }
  const rEd=new Set((CLOUD.remote.edits||[]).map(d=>d.id));
  const localE=Object.entries(edits).filter(([k])=>!rEd.has(String(k)));
  let take=false;
  if(nloc||localE.length){
    take=confirm(`Den här enheten har ${loc.actions.length} åtgärder, ${loc.plots.length} provytor, ${loc.custom.length} egna bestånd och ${localE.length} ändrade bestånd som inte finns i den delade planen. Ladda upp dem?`);
  }
  CLOUD.synced=true;
  try{localStorage.setItem('skogsplan:cloud-synced:'+CLOUD.user.uid,'1');}catch(e){}
  ['actions','edits','settings','plots','custom'].forEach(applyRemote);
  if(take){
    Object.keys(ARR).forEach(k=>ARR[k].set(ARR[k].get().concat(loc[k])));
    localE.forEach(([k,v])=>{edits[k]=v;});
    if(loc.custom.length)applyStands();
    persistLocal();cloudPush();remoteRender();
  }
  updateCloudChip();
}
function applyRemote(kind){
  const docs=CLOUD.remote[kind]||[];
  const sig=stable(docs.map(d=>[d.id,d.data]));
  if(CLOUD.sig[kind]===sig)return false;
  CLOUD.sig[kind]=sig;
  CLOUD.applying=true;
  try{
    if(ARR[kind]){
      const spec=ARR[kind];
      spec.set(docs.map(d=>spec.fromDoc(d.data,d.id)));
      CLOUD.last[kind]=new Map(spec.get().map(x=>[String(x.id),stable(spec.toDoc(x))]));
    }else if(kind==='edits'){
      const o={};docs.forEach(d=>{o[d.id]=d.data;});
      edits=sanitizeEdits(o);
      CLOUD.last.edits=new Map(Object.entries(edits).map(([k,v])=>[String(k),stable(v)]));
    }else{
      const fol=docs.find(d=>d.id==='follow'),map=docs.find(d=>d.id==='map');
      followYrs=sanitizeFollow(fol&&fol.data&&fol.data.pairs?safeJSON(fol.data.pairs):{});
      CLOUD.last.follow=stable(followYrs);
      const rm=docs.find(d=>d.id==='rem');
      remDone=sanitizeRem(rm&&rm.data&&rm.data.pairs?safeJSON(rm.data.pairs):{});
      CLOUD.last.rem=stable(remDone);
      const ct=docs.find(d=>d.id==='contact');
      contact=sanitizeContact(ct&&ct.data&&ct.data.json?safeJSON(ct.data.json):{});
      CLOUD.last.contact=stable(contact);
      if(map&&map.data&&map.data.mmlKey){CLOUD.last.map=map.data.mmlKey;if(!mmlKey)applyKey(map.data.mmlKey);}
    }
  }finally{CLOUD.applying=false;}
  if(kind==='custom')applyStands();
  persistLocal();remoteRender();
  return true;
}
function remoteRender(){
  restyle();renderActs();renderTable();updateHeader();
  if(!(formState||editMode||moveAid||suggest||plotForm))renderCard();
  const ae=document.activeElement;
  if(!(ae&&ae.closest&&ae.closest('#pane-data')))renderData();
}
function cloudPush(){
  if(!CLOUD.db||!CLOUD.user||!CLOUD.synced||CLOUD.applying)return;
  const M=CLOUD.api,db=CLOUD.db,fail=e=>cloudErr(e);
  const dref=(n,id)=>M.doc(db,'plans',PROP,n,id);
  for(const k of Object.keys(ARR)){
    const spec=ARR[k],last=CLOUD.last[k];
    const cur=new Map(spec.get().map(x=>[String(x.id),stable(spec.toDoc(x))]));
    cur.forEach((js,id)=>{if(last.get(id)!==js){last.set(id,js);M.setDoc(dref(spec.col,id),JSON.parse(js)).catch(fail);}});
    [...last.keys()].forEach(id=>{if(!cur.has(id)){last.delete(id);M.deleteDoc(dref(spec.col,id)).catch(fail);}});
  }
  const E=new Map(Object.entries(edits).map(([k,v])=>[String(k),stable(clean(v))]));
  E.forEach((js,id)=>{if(CLOUD.last.edits.get(id)!==js){CLOUD.last.edits.set(id,js);M.setDoc(dref('edits',id),JSON.parse(js)).catch(fail);}});
  [...CLOUD.last.edits.keys()].forEach(id=>{if(!E.has(id)){CLOUD.last.edits.delete(id);M.deleteDoc(dref('edits',id)).catch(fail);}});
  const f=stable(followYrs);
  if(f!==CLOUD.last.follow){CLOUD.last.follow=f;M.setDoc(dref('settings','follow'),{pairs:f}).catch(fail);}
  const rs=stable(remDone);
  if(rs!==CLOUD.last.rem){CLOUD.last.rem=rs;M.setDoc(dref('settings','rem'),{pairs:rs}).catch(fail);}
  const cs=stable(contact);
  if(cs!==CLOUD.last.contact){CLOUD.last.contact=cs;M.setDoc(dref('settings','contact'),{json:cs}).catch(fail);}
  if(mmlKey&&mmlKey!==BUILTIN_KEY&&mmlKey!==CLOUD.last.map){CLOUD.last.map=mmlKey;M.setDoc(dref('settings','map'),{mmlKey}).catch(fail);}
  updateCloudChip();
}
function cloudSectionHTML(){
  if(!CLOUD.cfg){
    return `<h3>Delad plan</h3>
    <p class="small muted">Inloggning och gemensam åtgärdslogg för flera användare är inte påslagen. Klistra in Firebase-konfigurationen (raden med apiKey, projectId och så vidare) för att slå på den.</p>
    <textarea id="cfgtxt" rows="4" spellcheck="false" placeholder='const firebaseConfig = { apiKey: "…", authDomain: "…", projectId: "…", appId: "…" };' style="width:100%;font:inherit;font-size:14px;padding:8px;border:1px solid #c4cbc0;border-radius:6px"></textarea>
    <p><button class="btn sec" data-do="savecfg">Spara och starta om</button></p>`;
  }
  return `<h3>Delad plan</h3>
    <p class="small">${CLOUD.user?'Inloggad som <b>'+esc(CLOUD.user.email||'')+'</b>':'Ej inloggad'} · ${esc(cloudStatusText())}</p>
    ${CLOUD.user?'<p><button class="btn sec" data-do="signout">Logga ut</button></p>':''}
    ${FIREBASE_CONFIG_EMBEDDED?'':'<p class="small"><button class="lnk red" data-do="clearcfg">Ta bort konfigurationen</button></p>'}`;
}

renderLegend();renderCard();renderActs();renderTable();renderData();
{let initFc=null;
